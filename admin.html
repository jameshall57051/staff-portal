<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Summer School Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f5f8;color:#172033;padding-bottom:30px}header{background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;padding:22px 18px}.wrap{max-width:1100px;margin:auto}.eyebrow{font-size:11px;letter-spacing:1px;font-weight:700;opacity:.8}h1{margin:5px 0 0;font-size:25px}.container{max-width:1100px;margin:auto;padding:16px}.toolbar{background:#fff;border-radius:15px;padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;box-shadow:0 2px 8px #00000009}.btn,input,select{border:1px solid #dfe4ea;border-radius:9px;padding:9px 11px;background:#fff;font:inherit}.btn{cursor:pointer;font-weight:700}.primary{background:#2563eb;color:#fff;border-color:#2563eb}.danger{color:#b91c1c;border-color:#fecaca}.table-wrap{overflow:auto;background:#fff;border-radius:15px;box-shadow:0 2px 10px #00000009}.table{min-width:820px}.row{display:grid;grid-template-columns:190px repeat(4,1fr);border-bottom:1px solid #edf0f3}.cell{padding:12px;border-right:1px solid #edf0f3;min-height:80px}.head{font-weight:800;background:#f8fafc;min-height:auto}.person{display:flex;gap:9px;align-items:center;font-weight:800}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#e0e7ff;color:#3730a3;font-size:11px}.shift{border-radius:10px;padding:8px;margin:3px 0;cursor:pointer}.shift.work{background:#dcfce7;color:#166534}.shift.lunch{background:#e0f2fe;color:#075985}.shift.dinner{background:#fef3c7;color:#92400e}.shift.meal{background:#f0fdf4;color:#166534;border-left:3px solid #22c55e;cursor:default}.off{color:#9ca3af;font-size:12px}.small{font-size:11px;color:#6b7280;margin-top:3px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;padding:10px;z-index:20}.modal.show{display:flex}.modal-box{background:#fff;width:min(560px,100%);max-height:90vh;overflow:auto;border-radius:18px 18px 12px 12px;padding:18px}.modal-box h2{margin:0 0 14px}.form{display:grid;gap:10px}.form label{font-size:11px;font-weight:700;color:#6b7280}.form input,.form select{width:100%}.actions{display:flex;gap:8px;margin-top:12px}.actions>*{flex:1}.staff-list{display:flex;gap:8px;flex-wrap:wrap}.staff-chip{padding:8px 10px;border-radius:999px;background:#eef2ff;color:#3730a3;cursor:pointer;border:0;font-weight:700;font-size:12px}.section-title{font-weight:800;margin:20px 2px 9px}.meal-settings{background:#fff;border-radius:15px;padding:14px;box-shadow:0 2px 8px #00000009;margin-bottom:14px}.meal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.meal-card{border:1px solid #e5e7eb;border-radius:12px;padding:12px}.meal-card h3{margin:0 0 8px;font-size:14px}.meal-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hint{font-size:11px;color:#6b7280;margin-top:8px}.week-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.week-title{font-size:16px;font-weight:800}.week-buttons{display:flex;gap:6px}.week-wrap{overflow:auto;background:#fff;border-radius:15px;box-shadow:0 2px 10px #00000009}.week-header,.week-row{display:grid;grid-template-columns:100px repeat(15,125px);min-width:1975px}.week-header{background:#f8fafc;border-bottom:1px solid #e5e7eb}.week-head{padding:11px 6px;text-align:center;font-size:10px;font-weight:800;border-right:1px solid #e5e7eb}.week-row{min-height:105px;border-bottom:1px solid #edf0f3}.week-date{padding:12px 6px;text-align:center;background:#f8fafc;border-right:1px solid #e5e7eb;font-size:10px}.week-date strong{display:block;font-size:12px}.week-date.today{background:#eff6ff;color:#2563eb}.week-cell{padding:5px;border-right:1px solid #edf0f3}.week-item{border-radius:8px;padding:7px;margin-bottom:5px;font-size:10px;cursor:pointer;background:#dcfce7;border-left:3px solid #22c55e}.week-item.lunch{background:#e0f2fe;border-left-color:#0ea5e9}.week-item.dinner{background:#fef3c7;border-left-color:#f59e0b}.week-item.meal{background:#f0fdf4;border-left-color:#22c55e;cursor:default}.week-name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.week-time,.week-staff{color:#64748b;margin-top:2px}.staff-manager{display:grid;gap:8px;margin-bottom:15px}.staff-row{display:flex;align-items:center;gap:10px;background:#f8fafc;padding:9px;border-radius:10px}.staff-row .name{flex:1;font-weight:700}@media(max-width:700px){.toolbar>*{flex:1}.meal-grid{grid-template-columns:1fr}.row{grid-template-columns:150px repeat(4,1fr)}.cell{padding:9px}}
</style>
</head>
<body>
<header><div class="wrap"><div class="eyebrow">SUMMER SCHOOL 2026</div><h1>Schedule Admin</h1></div></header>
<main class="container">
<div class="toolbar">
<input id="date" type="date">
<button class="btn primary" onclick="openShift()">＋ Add activity</button>
<button class="btn" onclick="openStaffManager()">👤 Manage staff</button>
<button class="btn" onclick="showWeek()">📅 Week view</button>
<button class="btn" onclick="copyDay()">Copy this day</button>
<button class="btn danger" onclick="clearDay()">Clear this day</button>
</div>

<div class="meal-settings">
<div style="font-weight:800;margin-bottom:3px">🍽 Meal times</div>
<div class="hint">These are eating times for all staff. They are separate from lunch/dinner duty.</div>
<div class="meal-grid" style="margin-top:12px">
<div class="meal-card"><h3>Lunch</h3><div class="meal-fields"><input id="lunchStart" type="time"><input id="lunchEnd" type="time"></div></div>
<div class="meal-card"><h3>Dinner</h3><div class="meal-fields"><input id="dinnerStart" type="time"><input id="dinnerEnd" type="time"></div></div>
</div>
<button class="btn primary" style="margin-top:10px" onclick="saveMealTimes()">Save meal times</button>
</div>

<div id="dayView">
<div class="table-wrap"><div id="table" class="table"></div></div>
</div>
<div id="weekView" style="display:none"></div>
</main>

<div id="modal" class="modal"><div class="modal-box">
<h2 id="modalTitle">Add activity</h2>
<div class="form">
<div><label>Staff member</label><select id="employee"></select></div>
<div><label>Type</label><select id="type"><option value="activity">Activity</option><option value="excursion">Excursion</option><option value="duty">General duty</option><option value="lunch">Lunch duty</option><option value="dinner">Dinner duty</option></select></div>
<div><label>Activity / duty</label><input id="activity" placeholder="e.g. Sports Activities"></div>
<div><label>Start</label><input id="start" type="time"></div>
<div><label>End</label><input id="end" type="time"></div>
<div><label>Location</label><input id="location" placeholder="e.g. Dining Hall"></div>
<div><label>Group</label><input id="group" placeholder="e.g. Group B"></div>
</div>
<div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn danger" id="deleteBtn" onclick="deleteShift()">Delete</button><button class="btn primary" onclick="saveShift()">Save</button></div>
</div></div>

<div id="staffModal" class="modal"><div class="modal-box">
<h2>Manage staff</h2><div id="staffManager" class="staff-manager"></div>
<div style="border-top:1px solid #e5e7eb;padding-top:14px"><label style="font-size:11px;font-weight:700;color:#6b7280">Add staff member</label><div style="display:flex;gap:8px;margin-top:5px"><input id="newStaffName" placeholder="e.g. John Smith" style="flex:1"><button class="btn primary" onclick="addStaff()">Add</button></div></div>
<div class="actions"><button class="btn" onclick="closeStaffManager()">Done</button></div>
</div></div>

<script src="app.js"></script>
<script>
let data=getData(),editing=null,weekStart=getMonday(TODAY);
const date=document.getElementById('date');date.value=dateKey(TODAY);date.onchange=render;
function initials(n){return n.split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase()}
function periodFor(t){const h=+t.split(':')[0];return h<12?'morning':h<14?'midday':h<18?'afternoon':'evening'}
function getMonday(d){const x=new Date(d),day=x.getDay();x.setDate(x.getDate()+(day===0?-6:1-day));x.setHours(0,0,0,0);return x}
function getShiftList(staffId,d){return getStaffSchedule(staffId,d)}
function render(){data=getData();loadMealFields();document.getElementById('dayView').style.display='block';document.getElementById('weekView').style.display='none';const d=parseDate(date.value),table=document.getElementById('table');let html='<div class="row"><div class="cell head">Staff</div><div class="cell head">Morning</div><div class="cell head">Midday</div><div class="cell head">Afternoon</div><div class="cell head">Evening</div></div>';data.staff.forEach(e=>{const list=getShiftList(e.id,d);html+=`<div class="row"><div class="cell"><div class="person"><div class="avatar">${initials(e.name)}</div>${esc(e.name)}</div></div>`;['morning','midday','afternoon','evening'].forEach(p=>{const items=list.filter(x=>periodFor(x.start)===p);html+=`<div class="cell">${items.length?items.map(x=>`<div class="shift ${x.type==='lunch'?'lunch':x.type==='dinner'?'dinner':'work'}" onclick="editShift('${e.id}','${x.id}')"><b>${iconFor(x.type)} ${esc(x.name)}</b><div class="small">${x.start}–${x.end}</div>${x.location?`<div class="small">📍 ${esc(x.location)}</div>`:''}</div>`).join(''):'<div class="off">—</div>'}</div>`});html+='</div>'});
if(!data.staff.length)html='<div class="empty" style="padding:30px">No staff added yet. Use Manage staff.</div>';table.innerHTML=html}
function loadMealFields(){const m=getMealTimes();document.getElementById('lunchStart').value=m.lunch?.start||'';document.getElementById('lunchEnd').value=m.lunch?.end||'';document.getElementById('dinnerStart').value=m.dinner?.start||'';document.getElementById('dinnerEnd').value=m.dinner?.end||''}
function saveMealTimes(){data=getData();const ls=document.getElementById('lunchStart').value,le=document.getElementById('lunchEnd').value,ds=document.getElementById('dinnerStart').value,de=document.getElementById('dinnerEnd').value;if((ls&&le&&minutes(le)<=minutes(ls))||(ds&&de&&minutes(de)<=minutes(ds))){alert('Meal end time must be after the start time.');return}data.mealTimes={lunch:{enabled:!!(ls&&le),start:ls,end:le},dinner:{enabled:!!(ds&&de),start:ds,end:de}};saveData(data);render();alert('Meal times saved. They will now appear on staff schedules.')}
function fillEmployee(){document.getElementById('employee').innerHTML=data.staff.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}
function openShift(staffId){editing=null;fillEmployee();if(staffId)document.getElementById('employee').value=staffId;document.getElementById('modalTitle').textContent='Add activity';document.getElementById('deleteBtn').style.display='none';['activity','start','end','location','group'].forEach(x=>document.getElementById(x).value='');document.getElementById('type').value='activity';document.getElementById('modal').classList.add('show')}
function editShift(eid,sid){data=getData();const e=data.staff.find(x=>x.id===eid),x=getStaffSchedule(eid,parseDate(date.value)).find(x=>x.id===sid);if(!e||!x)return;editing={eid,sid};fillEmployee();document.getElementById('employee').value=eid;document.getElementById('modalTitle').textContent='Edit activity';document.getElementById('deleteBtn').style.display='block';document.getElementById('type').value=x.type;document.getElementById('activity').value=x.name;document.getElementById('start').value=x.start;document.getElementById('end').value=x.end;document.getElementById('location').value=x.location||'';document.getElementById('group').value=x.group||'';document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function saveShift(){data=getData();const eid=document.getElementById('employee').value;if(!eid){alert('Add a staff member first.');return}const x={id:editing?editing.sid:newId('activity'),type:document.getElementById('type').value,name:document.getElementById('activity').value.trim(),date:date.value,start:document.getElementById('start').value,end:document.getElementById('end').value,location:document.getElementById('location').value.trim(),group:document.getElementById('group').value.trim(),staff:[eid]};if(!x.name||!x.start||!x.end){alert('Please complete activity, start and end.');return}if(minutes(x.end)<=minutes(x.start)){alert('End time must be after start time.');return}if(editing){const oldIndex=data.activities.findIndex(a=>a.id===editing.sid);if(oldIndex>=0)data.activities.splice(oldIndex,1)}data.activities.push(x);saveData(data);closeModal();render()}
function deleteShift(){if(!editing||!confirm('Delete this activity?'))return;data=getData();data.activities=data.activities.filter(x=>x.id!==editing.sid);saveData(data);closeModal();render()}
function copyDay(){const target=prompt('Copy this day to which date? Use YYYY-MM-DD.');if(!target||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(target)||target===date.value)return;data=getData();const source=data.activities.filter(x=>x.date===date.value);data.activities=data.activities.filter(x=>x.date!==target);source.forEach(x=>data.activities.push({...structuredClone(x),id:newId('activity'),date:target}));saveData(data);alert('Day copied.');render()}
function clearDay(){if(!confirm('Clear every activity for '+date.value+'?'))return;data=getData();data.activities=data.activities.filter(x=>x.date!==date.value);saveData(data);render()}
function openStaffManager(){renderStaffManager();document.getElementById('staffModal').classList.add('show')}
function closeStaffManager(){document.getElementById('staffModal').classList.remove('show');render()}
function renderStaffManager(){data=getData();document.getElementById('staffManager').innerHTML=data.staff.length?data.staff.map(e=>`<div class="staff-row"><div class="avatar">${initials(e.name)}</div><div class="name">${esc(e.name)}</div><button class="btn danger" onclick="removeStaff('${e.id}')">Delete</button></div>`).join(''):'<div class="hint">No staff members yet.</div>'}
function addStaff(){const input=document.getElementById('newStaffName'),name=input.value.trim();if(!name)return alert('Enter a staff member name.');data=getData();if(data.staff.some(e=>e.name.toLowerCase()===name.toLowerCase()))return alert('That staff member already exists.');data.staff.push({id:newId('staff'),name});saveData(data);input.value='';renderStaffManager();render()}
function removeStaff(id){data=getData();const p=data.staff.find(x=>x.id===id);if(!p)return;if(!confirm(`Remove ${p.name}? They will also be removed from assigned activities.`))return;data.staff=data.staff.filter(x=>x.id!==id);data.activities.forEach(a=>a.staff=a.staff.filter(s=>s!==id));saveData(data);renderStaffManager();render()}
function showWeek(){document.getElementById('dayView').style.display='none';document.getElementById('weekView').style.display='block';renderWeek()}
function renderWeek(){data=getData();const hours=[];for(let h=8;h<=22;h++)hours.push(h);const days=Array.from({length:7},(_,i)=>addDays(weekStart,i));const title=`${days[0].toLocaleDateString('en-GB',{day:'numeric',month:'short'})} – ${days[6].toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}`;let html=`<div class="week-nav"><div class="week-title">${title}</div><div class="week-buttons"><button class="btn" onclick="previousWeek()">←</button><button class="btn" onclick="currentWeek()">Today</button><button class="btn" onclick="nextWeek()">→</button></div></div><div class="week-wrap"><div class="week-header"><div class="week-head">Date</div>`;hours.forEach(h=>html+=`<div class="week-head">${String(h).padStart(2,'0')}:00</div>`);html+='</div>';
days.forEach(day=>{const key=dateKey(day),today=key===dateKey(TODAY);html+=`<div class="week-row"><div class="week-date ${today?'today':''}"><strong>${day.toLocaleDateString('en-GB',{weekday:'short'})}</strong>${day.getDate()} ${day.toLocaleDateString('en-GB',{month:'short'})}</div>`;hours.forEach(h=>{const rs=h*60,re=(h+1)*60;const acts=data.activities.filter(a=>a.date===key&&minutes(a.start)<re&&minutes(a.end)>rs);const meals=mealBlocksForDate(day).filter(m=>minutes(m.start)<re&&minutes(m.end)>rs);html+='<div class="week-cell">';meals.forEach(m=>html+=`<div class="week-item meal"><div class="week-name">🍽 ${m.meal}</div><div class="week-time">${m.start}–${m.end}</div><div class="week-staff">Staff meal</div></div>`);acts.forEach(a=>{const names=a.staff.map(id=>getStaff(id)?.name.split(' ')[0]).filter(Boolean).join(', ');html+=`<div class="week-item ${a.type==='lunch'?'lunch':a.type==='dinner'?'dinner':''}" onclick="date.value='${key}';document.getElementById('dayView').style.display='block';document.getElementById('weekView').style.display='none';render();setTimeout(()=>editShift('${a.staff[0]}','${a.id}'),0)"><div class="week-name">${iconFor(a.type)} ${esc(a.name)}</div><div class="week-time">${a.start}–${a.end}</div><div class="week-staff">${esc(names||'No staff')}</div></div>`});html+='</div>'});html+='</div>'});html+='</div>';document.getElementById('weekView').innerHTML=html}
function previousWeek(){weekStart=addDays(weekStart,-7);renderWeek()}
function nextWeek(){weekStart=addDays(weekStart,7);renderWeek()}
function currentWeek(){weekStart=getMonday(TODAY);renderWeek()}
render();
</script>
</body></html>
