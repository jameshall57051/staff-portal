<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>Summer School Staff</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    background: #f3f5f8;

    color: #172033;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    padding-bottom: 75px;
}

header {
    background:
        linear-gradient(
            135deg,
            #2563eb,
            #4f46e5
        );

    color: white;

    padding: 24px 18px;
}

.wrap {
    max-width: 850px;
    margin: auto;
}

.eyebrow {
    font-size: 11px;

    font-weight: 700;

    letter-spacing: 1px;

    opacity: .8;
}

.header-row {
    display: flex;

    justify-content:
        space-between;

    align-items: center;

    gap: 10px;
}

h1 {
    margin: 5px 0 0;

    font-size: 27px;
}

.container {
    max-width: 850px;

    margin: auto;

    padding: 16px;
}

.date-card {
    background: white;

    border-radius: 16px;

    padding: 15px 17px;

    margin-bottom: 15px;

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    box-shadow:
        0 2px 10px rgba(0,0,0,.05);
}

.date-small {
    color: #9ca3af;

    text-transform:
        uppercase;

    font-size: 10px;

    letter-spacing: .5px;
}

.date {
    font-weight: 800;

    margin-top: 3px;
}

.btn {
    border: 0;

    border-radius: 10px;

    padding: 9px 12px;

    background: #eef2ff;

    color: #3730a3;

    font-weight: 700;

    text-decoration: none;

    font-size: 12px;
}

.staff-grid {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 12px;
}

.staff-card {
    background: white;

    border-radius: 16px;

    padding: 15px;

    text-decoration: none;

    color: inherit;

    box-shadow:
        0 2px 9px rgba(0,0,0,.05);
}

.staff-top {
    display: flex;

    align-items: center;

    gap: 10px;
}

.avatar {
    width: 44px;

    height: 44px;

    border-radius: 50%;

    background: #e0e7ff;

    color: #3730a3;

    display: grid;

    place-items: center;

    font-size: 12px;

    font-weight: 800;
}

.name {
    font-weight: 800;

    flex: 1;
}

.status {
    display: flex;

    align-items: center;

    gap: 5px;

    font-size: 10px;

    font-weight: 800;
}

.dot {
    width: 10px;

    height: 10px;

    border-radius: 50%;
}

.green {
    background: #22c55e;
}

.red {
    background: #ef4444;
}

.next {
    border-top:
        1px solid #edf0f3;

    margin-top: 13px;

    padding-top: 12px;
}

.label {
    color: #9ca3af;

    text-transform:
        uppercase;

    font-size: 9px;

    letter-spacing: .5px;
}

.activity {
    font-weight: 800;

    font-size: 14px;

    margin-top: 4px;
}

.details {
    color: #6b7280;

    font-size: 11px;

    margin-top: 3px;
}

.empty {
    grid-column: 1/-1;

    background: white;

    border-radius: 16px;

    padding: 35px;

    text-align: center;

    color: #8a93a3;
}

.nav {
    position: fixed;

    bottom: 0;

    left: 0;

    right: 0;

    height: 64px;

    background: white;

    border-top:
        1px solid #e5e7eb;

    display: flex;

    justify-content:
        center;

    gap: 70px;

    align-items: center;
}

.nav a {
    text-decoration: none;

    color: #687386;

    text-align: center;

    font-size: 11px;
}

.nav span {
    display: block;

    font-size: 20px;
}

.nav .active {
    color: #2563eb;
}

@media(max-width:600px) {

    .staff-grid {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<header>

<div class="wrap">

<div class="eyebrow">
SUMMER SCHOOL 2026
</div>

<div class="header-row">

<h1>
Staff
</h1>

<a
    class="btn"
    href="staff.html"
>
My Schedule
</a>

</div>

</div>

</header>


<main class="container">


<div class="date-card">

<div>

<div class="date-small">
Today
</div>

<div
    id="date"
    class="date"
></div>

</div>


<button
    class="btn"
    onclick="render()"
>
↻ Refresh
</button>

</div>


<div
    id="staffGrid"
    class="staff-grid"
></div>


</main>


<nav class="nav">

<a
    href="index.html"
    class="active"
>

<span>⌂</span>

Staff

</a>


<a href="admin.html">

<span>▦</span>

Admin

</a>

</nav>


<script src="app.js"></script>


<script>

function initials(name) {

    return name
        .split(/\s+/)
        .map(x => x[0])
        .slice(0,2)
        .join("")
        .toUpperCase();

}


function render() {

    const data =
        getData();


    document.getElementById(
        "date"
    ).textContent =
        formatDate(TODAY);


    const grid =
        document.getElementById(
            "staffGrid"
        );


    grid.innerHTML = "";


    data.staff.forEach(person => {

        const status =
            getStaffStatus(
                person.id,
                TODAY
            );


        const activity =
            status.item;


        const card =
            document.createElement(
                "a"
            );


        card.className =
            "staff-card";


        card.href =
            `staff.html?id=${encodeURIComponent(person.id)}`;


        card.innerHTML = `

            <div class="staff-top">

                <div class="avatar">

                    ${initials(person.name)}

                </div>


                <div class="name">

                    ${esc(person.name)}

                </div>


                <div class="status">

                    <span
                        class="dot ${
                            status.working
                            ? "green"
                            : "red"
                        }"
                    ></span>

                    ${
                        status.working
                        ? "WORKING"
                        : "OFF"
                    }

                </div>

            </div>


            <div class="next">

                <div class="label">

                    ${
                        status.current
                        ? "Working now"
                        :
                        status.next
                        ? "Next shift"
                        :
                        "Today"
                    }

                </div>


                ${
                    activity

                    ?

                    `

                    <div class="activity">

                        ${esc(activity.name)}

                    </div>


                    <div class="details">

                        ${activity.start}
                        –
                        ${activity.end}

                        ${
                            activity.location
                            ?
                            ` · 📍 ${esc(activity.location)}`
                            :
                            ""
                        }

                    </div>

                    `

                    :

                    `

                    <div class="details">

                        No more scheduled shifts today.

                    </div>

                    `
                }

            </div>

        `;


        grid.appendChild(card);

    });


    if (!data.staff.length) {

        grid.innerHTML = `

            <div class="empty">

                No staff have been added yet.

            </div>

        `;

    }

}


render();


setInterval(
    render,
    60000
);

</script>

</body>

</html>
