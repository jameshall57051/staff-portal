<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<title>Summer School Admin</title>

<style>

/* =====================================================
   WEEK VIEW - DAYS DOWN, TIMES ACROSS
===================================================== */

.week-container {
    background: white;

    border-radius: 16px;

    box-shadow:
        0 2px 10px rgba(0,0,0,.05);

    overflow-x: auto;

    margin-bottom: 16px;
}


/* HEADER */

.week-header {

    display: grid;

    /*
        First column = date
        Remaining columns = times
    */

    grid-template-columns:
        90px
        repeat(15, 125px);

    min-width: 1965px;

    background: #f8fafc;

    border-bottom:
        1px solid #e5e7eb;
}


.week-header-cell {

    padding: 12px 7px;

    text-align: center;

    font-size: 10px;

    font-weight: 800;

    border-right:
        1px solid #e5e7eb;
}


/* BODY */

.week-body {

    min-width: 1965px;
}


/* ONE ROW PER DAY */

.week-row {

    display: grid;

    grid-template-columns:
        90px
        repeat(15, 125px);

    min-height: 105px;

    border-bottom:
        1px solid #edf0f3;
}


/* DATE COLUMN */

.week-time {

    padding: 12px 6px;

    text-align: center;

    color: #6b7280;

    font-size: 10px;

    border-right:
        1px solid #e5e7eb;

    background: #f8fafc;
}


.week-time strong {

    color: #172033;

    font-size: 12px;
}


.week-time.today {

    background: #eff6ff;

    color: #2563eb;
}


.week-time.today strong {

    color: #2563eb;
}


/* CELLS */

.week-cell {

    padding: 5px;

    border-right:
        1px solid #edf0f3;

    min-width: 0;
}


/* TODAY */

.today-row {

    background:
        rgba(239,246,255,.35);
}


/* ACTIVITY */

.week-activity {

    background: #dcfce7;

    border-left:
        3px solid #22c55e;

    border-radius: 8px;

    padding: 7px;

    margin-bottom: 5px;

    cursor: pointer;

    font-size: 10px;
}


.week-activity:hover {

    filter:
        brightness(.97);

    transform:
        translateY(-1px);
}


/* EXCURSION */

.week-activity.excursion {

    background: #ede9fe;

    border-left-color:
        #8b5cf6;
}


/* LUNCH */

.week-activity.lunch {

    background: #e0f2fe;

    border-left-color:
        #0ea5e9;
}


/* DINNER */

.week-activity.dinner {

    background: #fef3c7;

    border-left-color:
        #f59e0b;
}


/* DUTY */

.week-activity.duty {

    background: #f1f5f9;

    border-left-color:
        #64748b;
}


.week-activity-name {

    font-weight: 800;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;
}


.week-activity-time {

    color: #64748b;

    margin-top: 2px;
}


.week-staff {

    color: #64748b;

    margin-top: 3px;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;
}

.week-navigation {
    display: flex;

    justify-content:
        space-between;

    align-items: center;

    margin-bottom: 12px;
}

.week-title {
    font-size: 16px;

    font-weight: 800;
}

.week-nav-buttons {
    display: flex;

    gap: 6px;
}

.week-nav-buttons button {
    padding: 7px 10px;

    font-size: 11px;
}
    
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f3f5f8;
    color: #172033;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

header {
    background:
        linear-gradient(
            135deg,
            #2563eb,
            #4f46e5
        );

    color: white;

    padding: 24px 18px;
}

.wrap {
    max-width: 850px;
    margin: auto;
}

.eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    opacity: .8;
}

h1 {
    margin: 5px 0 0;
    font-size: 27px;
}

.container {
    max-width: 850px;
    margin: auto;
    padding: 16px;
}

.toolbar {
    background: white;
    border-radius: 16px;
    padding: 14px;

    display: flex;
    gap: 9px;
    flex-wrap: wrap;

    box-shadow:
        0 2px 10px rgba(0,0,0,.05);

    margin-bottom: 16px;
}

input,
select,
button {
    font: inherit;
}

input,
select {
    border:
        1px solid #dfe4ea;

    border-radius: 10px;

    padding: 10px;
}

button {
    border: 0;

    border-radius: 10px;

    padding: 10px 14px;

    font-weight: 700;

    cursor: pointer;
}

.primary {
    background: #2563eb;
    color: white;
}

.secondary {
    background: #eef2ff;
    color: #3730a3;
}

.danger {
    background: #fee2e2;
    color: #991b1b;
}

.date {
    flex: 1;
    min-width: 180px;
}

.activity {
    background: white;

    border-radius: 16px;

    padding: 16px;

    margin-bottom: 12px;

    box-shadow:
        0 2px 10px rgba(0,0,0,.05);
}

.activity-top {
    display: flex;
    gap: 12px;
    align-items: flex-start;
}

.activity-icon {
    width: 44px;
    height: 44px;

    border-radius: 12px;

    display: grid;
    place-items: center;

    font-size: 21px;

    background: #dcfce7;
}

.activity-info {
    flex: 1;
}

.activity-name {
    font-weight: 800;
    font-size: 16px;
}

.activity-time {
    color: #6b7280;
    font-size: 12px;
    margin-top: 4px;
}

.activity-details {
    color: #6b7280;
    font-size: 12px;
    line-height: 1.6;
    margin-top: 8px;
}

.staff-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;

    margin-top: 13px;
}

.staff-chip {
    background: #eef2ff;

    color: #3730a3;

    border-radius: 999px;

    padding: 6px 9px;

    font-size: 11px;

    font-weight: 700;
}

.actions {
    display: flex;
    gap: 7px;

    margin-top: 13px;
}

.actions button {
    flex: 1;
}

.empty {
    background: white;

    border-radius: 16px;

    padding: 45px 20px;

    text-align: center;

    color: #8a93a3;
}

.modal {
    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.55);

    display: none;

    align-items: flex-end;

    justify-content: center;

    padding: 10px;

    z-index: 100;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: min(550px, 100%);

    background: white;

    border-radius:
        20px
        20px
        12px
        12px;

    padding: 20px;

    max-height: 92vh;

    overflow-y: auto;
}

.modal-box h2 {
    margin: 0 0 18px;
}

.form {
    display: grid;

    gap: 12px;
}

.form label {
    display: block;

    font-size: 11px;

    font-weight: 700;

    color: #6b7280;

    margin-bottom: 5px;
}

.form input,
.form select {
    width: 100%;
}

.time-row {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;
}

.staff-heading {
    margin-top: 5px;

    font-size: 13px;

    font-weight: 800;
}

.staff-checkboxes {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 7px;
}

.staff-check {
    border:
        1px solid #e5e7eb;

    border-radius: 10px;

    padding: 10px;

    cursor: pointer;

    display: flex;

    align-items: center;

    gap: 8px;

    font-size: 12px;

    font-weight: 600;
}

.staff-check:has(input:checked) {
    background: #eff6ff;

    border-color: #93c5fd;

    color: #1d4ed8;
}

.modal-actions {
    display: flex;

    gap: 8px;

    margin-top: 18px;
}

.modal-actions button {
    flex: 1;
}

@media(max-width:500px) {

    .staff-checkboxes {
        grid-template-columns: 1fr;
    }

    .time-row {
        grid-template-columns: 1fr 1fr;
    }

}

</style>

</head>


<body>

>
Clear Day

<script>

/* =====================================================
   WEEK VIEW
===================================================== */

let weekStart = getMonday(TODAY);


/* -----------------------------------------------------
   GET MONDAY
----------------------------------------------------- */

function getMonday(date) {

    const result =
        new Date(date);

    const day =
        result.getDay();

    const difference =
        day === 0
        ? -6
        : 1 - day;

    result.setDate(
        result.getDate() +
        difference
    );

    result.setHours(
        0, 0, 0, 0
    );

    return result;
}


/* -----------------------------------------------------
   SHOW WEEK VIEW
----------------------------------------------------- */

function showWeekView() {

    document.getElementById(
        "activities"
    ).style.display = "none";


    document.getElementById(
        "weekView"
    ).style.display = "block";


    renderWeekView();
}


/* -----------------------------------------------------
   RENDER WEEK
----------------------------------------------------- */

function renderWeekView() {

    data = getData();

    const container =
        document.getElementById("weekView");


    const days =
        Array.from(
            { length: 7 },
            (_, index) =>
                addDays(
                    weekStart,
                    index
                )
        );


    const weekEnd =
        days[6];


    const title =
        `${days[0].toLocaleDateString(
            "en-GB",
            {
                day: "numeric",
                month: "short"
            }
        )} – ${weekEnd.toLocaleDateString(
            "en-GB",
            {
                day: "numeric",
                month: "short",
                year: "numeric"
            }
        )}`;


    /*
        Times run horizontally.
    */

    const hours = [];


    for (
        let hour = 8;
        hour <= 22;
        hour++
    ) {

        hours.push(hour);

    }


    let html = `

        <div class="week-navigation">

            <div class="week-title">

                ${title}

            </div>


            <div class="week-nav-buttons">

                <button
                    class="secondary"
                    onclick="previousWeek()"
                >
                    ←
                </button>


                <button
                    class="secondary"
                    onclick="currentWeek()"
                >
                    Today
                </button>


                <button
                    class="secondary"
                    onclick="nextWeek()"
                >
                    →
                </button>

            </div>

        </div>


        <div class="week-container">

            <div class="week-header">

                <div class="week-header-cell">
                    Date
                </div>

    `;


    /*
        TIME HEADERS
    */

    hours.forEach(hour => {

        html += `

            <div class="week-header-cell">

                ${String(hour).padStart(2,"0")}:00

            </div>

        `;

    });


    html += `

            </div>

            <div class="week-body">

    `;


    /*
        ONE ROW PER DAY
    */

    days.forEach(day => {

        const dayKey =
            dateKey(day);


        const isToday =
            dayKey ===
            dateKey(TODAY);


        html += `

            <div
                class="
                    week-row
                    ${isToday ? "today-row" : ""}
                "
            >

                <div
                    class="
                        week-time
                        date-cell
                        ${isToday ? "today" : ""}
                    "
                >

                    <strong>

                        ${day.toLocaleDateString(
                            "en-GB",
                            {
                                weekday: "short"
                            }
                        )}

                    </strong>


                    <br>


                    ${day.getDate()}

                    ${day.toLocaleDateString(
                        "en-GB",
                        {
                            month: "short"
                        }
                    )}

                </div>

        `;


        /*
            CELLS FOR EACH HOUR
        */

        hours.forEach(hour => {

            const rowStart =
                hour * 60;


            const rowEnd =
                (hour + 1) * 60;


            const activities =
                data.activities
                    .filter(
                        activity =>
                            activity.date ===
                            dayKey
                    )
                    .filter(
                        activity => {

                            const start =
                                minutes(
                                    activity.start
                                );

                            const end =
                                minutes(
                                    activity.end
                                );


                            return (
                                start < rowEnd &&
                                end > rowStart
                            );

                        }
                    )
                    .sort(
                        (a,b) =>
                            minutes(a.start) -
                            minutes(b.start)
                    );


            html += `

                <div class="week-cell">

            `;


            activities.forEach(
                activity => {

                    const staff =
                        activity.staff
                            .map(
                                id =>
                                    data.staff.find(
                                        person =>
                                            person.id === id
                                    )
                            )
                            .filter(Boolean);


                    /*
                        Show first names to
                        keep the grid compact.
                    */

                    const staffNames =
                        staff
                            .map(
                                person =>
                                    person.name
                                        .split(" ")[0]
                            )
                            .join(", ");


                    html += `

                        <div
                            class="
                                week-activity
                                ${activity.type}
                            "
                            onclick="
                                editActivity(
                                    '${activity.id}'
                                )
                            "
                        >

                            <div
                                class="
                                    week-activity-name
                                "
                            >

                                ${iconFor(
                                    activity.type
                                )}

                                ${esc(
                                    activity.name
                                )}

                            </div>


                            <div
                                class="
                                    week-activity-time
                                "
                            >

                                ${activity.start}
                                –
                                ${activity.end}

                            </div>


                            <div
                                class="
                                    week-staff
                                "
                            >

                                ${
                                    staff.length
                                    ?
                                    `👤 ${esc(
                                        staffNames
                                    )}`
                                    :
                                    "⚠ No staff"
                                }

                            </div>

                        </div>

                    `;

                }
            );


            html += `

                </div>

            `;

        });


        html += `

            </div>

        `;

    });


    html += `

            </div>

        </div>

    `;


    container.innerHTML =
        html;
}


/* =====================================================
   WEEK NAVIGATION
===================================================== */

function previousWeek() {

    weekStart =
        addDays(
            weekStart,
            -7
        );

    renderWeekView();
}


function nextWeek() {

    weekStart =
        addDays(
            weekStart,
            7
        );

    renderWeekView();
}


function currentWeek() {

    weekStart =
        getMonday(TODAY);

    renderWeekView();
}    

let data = getData();

let editingId = null;


const dateInput =
    document.getElementById("date");


dateInput.value =
    dateKey(TODAY);


dateInput.addEventListener(
    "change",
    render
);


/* =====================================================
   ICON
===================================================== */

function iconFor(type) {

    if (type === "excursion")
        return "🚌";

    if (type === "lunch")
        return "🍽️";

    if (type === "dinner")
        return "🍽️";

    if (type === "duty")
        return "📋";

    return "🟢";
}


/* =====================================================
   RENDER
===================================================== */

function render() {

    document.getElementById(
    "weekView"
).style.display = "none";

document.getElementById(
    "activities"
).style.display = "block";

    data = getData();

    const date =
        dateInput.value;

    const activities =
        data.activities
            .filter(
                activity =>
                    activity.date === date
            )
            .sort(
                (a,b) =>
                    minutes(a.start) -
                    minutes(b.start)
            );


    const container =
        document.getElementById(
            "activities"
        );


    if (!activities.length) {

        container.innerHTML = `

            <div class="empty">

                <div style="
                    font-size:35px;
                    margin-bottom:10px;
                ">
                    📅
                </div>

                <strong>
                    No activities scheduled
                </strong>

                <div style="
                    margin-top:5px;
                    font-size:12px;
                ">
                    Add an activity or excursion
                    to get started.
                </div>

            </div>

        `;

        return;
    }


    container.innerHTML = "";


    activities.forEach(activity => {

        const staff =
            activity.staff
                .map(id =>
                    data.staff.find(
                        person =>
                            person.id === id
                    )
                )
                .filter(Boolean);


        const div =
            document.createElement(
                "div"
            );


        div.className =
            "activity";


        div.innerHTML = `

            <div class="activity-top">

                <div class="activity-icon">
                    ${iconFor(activity.type)}
                </div>


                <div class="activity-info">

                    <div class="activity-name">

                        ${esc(activity.name)}

                    </div>


                    <div class="activity-time">

                        ${activity.start}
                        –
                        ${activity.end}

                    </div>


                    <div class="activity-details">

                        ${
                            activity.location
                            ?
                            `📍 ${esc(activity.location)}`
                            :
                            ""
                        }

                        ${
                            activity.group
                            ?
                            `<br>👥 ${esc(activity.group)}`
                            :
                            ""
                        }

                    </div>

                </div>

            </div>


            <div class="staff-list">

                ${
                    staff.length

                    ?

                    staff.map(person => `

                        <span class="staff-chip">

                            ${esc(person.name)}

                        </span>

                    `).join("")

                    :

                    `<span
                        style="
                            color:#ef4444;
                            font-size:11px;
                        "
                    >
                        No staff assigned
                    </span>`
                }

            </div>


            <div class="actions">

                <button
                    class="secondary"
                    onclick="editActivity('${activity.id}')"
                >
                    Edit
                </button>


                <button
                    class="danger"
                    onclick="removeActivity('${activity.id}')"
                >
                    Delete
                </button>

            </div>

        `;


        container.appendChild(div);

    });

}


/* =====================================================
   STAFF CHECKBOXES
===================================================== */

function renderStaffCheckboxes(
    selected = []
) {

    const container =
        document.getElementById(
            "staffCheckboxes"
        );


    container.innerHTML =
        data.staff.map(person => `

            <label class="staff-check">

                <input
                    type="checkbox"
                    value="${person.id}"
                    ${selected.includes(person.id)
                        ? "checked"
                        : ""}
                >

                ${esc(person.name)}

            </label>

        `).join("");

}


/* =====================================================
   OPEN ADD
===================================================== */

function openAdd() {

    editingId = null;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Add Activity";


    document.getElementById(
        "deleteButton"
    ).style.display =
        "none";


    document.getElementById(
        "name"
    ).value = "";


    document.getElementById(
        "type"
    ).value =
        "activity";


    document.getElementById(
        "start"
    ).value = "";


    document.getElementById(
        "end"
    ).value = "";


    document.getElementById(
        "location"
    ).value = "";


    document.getElementById(
        "group"
    ).value = "";


    renderStaffCheckboxes();


    document.getElementById(
        "modal"
    ).classList.add("show");
}


/* =====================================================
   EDIT
===================================================== */

function editActivity(id) {

    const activity =
        data.activities.find(
            item =>
                item.id === id
        );


    if (!activity)
        return;


    editingId = id;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Edit Activity";


    document.getElementById(
        "deleteButton"
    ).style.display =
        "block";


    document.getElementById(
        "name"
    ).value =
        activity.name;


    document.getElementById(
        "type"
    ).value =
        activity.type;


    document.getElementById(
        "start"
    ).value =
        activity.start;


    document.getElementById(
        "end"
    ).value =
        activity.end;


    document.getElementById(
        "location"
    ).value =
        activity.location || "";


    document.getElementById(
        "group"
    ).value =
        activity.group || "";


    renderStaffCheckboxes(
        activity.staff
    );


    document.getElementById(
        "modal"
    ).classList.add("show");
}


/* =====================================================
   SAVE
===================================================== */

function saveActivity() {

    const name =
        document.getElementById(
            "name"
        ).value.trim();


    const type =
        document.getElementById(
            "type"
        ).value;


    const start =
        document.getElementById(
            "start"
        ).value;


    const end =
        document.getElementById(
            "end"
        ).value;


    const location =
        document.getElementById(
            "location"
        ).value.trim();


    const group =
        document.getElementById(
            "group"
        ).value.trim();


    const staff =
        [...document.querySelectorAll(
            "#staffCheckboxes input:checked"
        )].map(
            checkbox =>
                checkbox.value
        );


    if (!name || !start || !end) {

        alert(
            "Please enter an activity name, start time and end time."
        );

        return;
    }


    if (
        minutes(end) <=
        minutes(start)
    ) {

        alert(
            "The end time must be after the start time."
        );

        return;
    }


    if (!staff.length) {

        if (
            !confirm(
                "No staff members have been assigned. Save anyway?"
            )
        ) {

            return;
        }
    }


    if (editingId) {

        const activity =
            data.activities.find(
                item =>
                    item.id === editingId
            );


        if (activity) {

            activity.name = name;

            activity.type = type;

            activity.date =
                dateInput.value;

            activity.start = start;

            activity.end = end;

            activity.location =
                location;

            activity.group =
                group;

            activity.staff =
                staff;
        }

    } else {

        data.activities.push({

            id: newId("activity"),

            name,

            type,

            date:
                dateInput.value,

            start,

            end,

            location,

            group,

            staff

        });

    }


    saveData(data);

    closeModal();

    render();
}


/* =====================================================
   DELETE
===================================================== */

function deleteActivity() {

    if (!editingId)
        return;


    if (
        !confirm(
            "Delete this activity? It will be removed from every assigned staff member's schedule."
        )
    ) {

        return;
    }


    data.activities =
        data.activities.filter(
            activity =>
                activity.id !== editingId
        );


    saveData(data);

    closeModal();

    render();
}


function removeActivity(id) {

    if (
        !confirm(
            "Delete this activity?"
        )
    ) {

        return;
    }


    data.activities =
        data.activities.filter(
            activity =>
                activity.id !== id
        );


    saveData(data);

    render();
}


/* =====================================================
   COPY DAY
===================================================== */

function copyDay() {

    const target =
        prompt(
            "Copy this day's activities to which date?\n\nUse YYYY-MM-DD."
        );


    if (!target)
        return;


    if (
        !/^\d{4}-\d{2}-\d{2}$/.test(
            target
        )
    ) {

        alert(
            "Please use YYYY-MM-DD."
        );

        return;
    }


    if (
        target === dateInput.value
    ) {

        alert(
            "Choose a different date."
        );

        return;
    }


    const source =
        data.activities.filter(
            activity =>
                activity.date ===
                dateInput.value
        );


    const copied =
        source.map(activity => ({

            ...structuredClone(activity),

            id:
                newId("activity"),

            date:
                target

        }));


    data.activities =
        data.activities.filter(
            activity =>
                activity.date !== target
        );


    data.activities.push(
        ...copied
    );


    saveData(data);


    alert(
        `${copied.length} activities copied.`
    );
}


/* =====================================================
   CLEAR DAY
===================================================== */

function clearDay() {

    const date =
        dateInput.value;


    if (
        !confirm(
            `Clear every activity on ${date}?`
        )
    ) {

        return;
    }


    data.activities =
        data.activities.filter(
            activity =>
                activity.date !== date
        );


    saveData(data);

    render();
}


/* =====================================================
   CLOSE
===================================================== */

function closeModal() {

    document.getElementById(
        "modal"
    ).classList.remove("show");

}


/* =====================================================
   START
===================================================== */

render();

/* =====================================================
   STAFF MANAGER
===================================================== */

function openStaffManager() {

    data = getData();

    renderStaffManager();

    document
        .getElementById("staffModal")
        .classList.add("show");
}


function closeStaffManager() {

    document
        .getElementById("staffModal")
        .classList.remove("show");

    render();
}


/* =====================================================
   DISPLAY STAFF
===================================================== */

function renderStaffManager() {

    data = getData();

    const container =
        document.getElementById(
            "staffList"
        );


    if (!data.staff.length) {

        container.innerHTML = `

            <div
                style="
                    padding:20px;
                    text-align:center;
                    color:#9ca3af;
                    background:#f8fafc;
                    border-radius:10px;
                    font-size:12px;
                "
            >
                No staff members yet.
            </div>

        `;

        return;
    }


    container.innerHTML =
        data.staff.map(person => `

            <div
                style="
                    display:flex;
                    align-items:center;
                    gap:10px;
                    padding:11px;
                    background:#f8fafc;
                    border-radius:10px;
                "
            >

                <div
                    style="
                        width:34px;
                        height:34px;
                        border-radius:50%;
                        background:#e0e7ff;
                        color:#3730a3;
                        display:grid;
                        place-items:center;
                        font-size:10px;
                        font-weight:800;
                    "
                >

                    ${getInitials(person.name)}

                </div>


                <div
                    style="
                        flex:1;
                        font-size:13px;
                        font-weight:700;
                    "
                >

                    ${esc(person.name)}

                </div>


                <button
                    class="danger"
                    style="
                        padding:7px 10px;
                        font-size:11px;
                    "
                    onclick="
                        removeStaff('${person.id}')
                    "
                >
                    Delete
                </button>

            </div>

        `).join("");
}


/* =====================================================
   ADD STAFF
===================================================== */

function addStaff() {

    const input =
        document.getElementById(
            "newStaffName"
        );


    const name =
        input.value.trim();


    if (!name) {

        alert(
            "Please enter a staff member's name."
        );

        return;
    }


    data = getData();


    /* Prevent duplicates */

    const alreadyExists =
        data.staff.some(
            person =>
                person.name
                    .toLowerCase() ===
                name.toLowerCase()
        );


    if (alreadyExists) {

        alert(
            "That staff member already exists."
        );

        return;
    }


    data.staff.push({

        id: newId("staff"),

        name: name

    });


    saveData(data);


    input.value = "";


    renderStaffManager();


    /*
        Refresh the activity form too,
        so the new employee immediately
        appears in the staff checkboxes.
    */

    renderStaffCheckboxes();

}


/* =====================================================
   DELETE STAFF
===================================================== */

function removeStaff(id) {

    data = getData();


    const person =
        data.staff.find(
            staff =>
                staff.id === id
        );


    if (!person)
        return;


    /*
        Check whether this person
        is assigned to any activities.
    */

    const assignedActivities =
        data.activities.filter(
            activity =>
                activity.staff.includes(id)
        );


    let message =
        `Remove ${person.name}?`;


    if (assignedActivities.length) {

        message +=
            `\n\nThey are currently assigned to ` +
            `${assignedActivities.length} ` +
            `activity/activities. ` +
            `They will be removed from those activities.`;

    }


    if (!confirm(message))
        return;


    /* Remove from staff list */

    data.staff =
        data.staff.filter(
            staff =>
                staff.id !== id
        );


    /*
        Remove them from
        every activity assignment.
    */

    data.activities.forEach(
        activity => {

            activity.staff =
                activity.staff.filter(
                    staffId =>
                        staffId !== id
                );

        }
    );


    saveData(data);


    renderStaffManager();


    renderStaffCheckboxes();

}


/* =====================================================
   INITIALS
===================================================== */

function getInitials(name) {

    return name
        .split(/\s+/)
        .map(
            part =>
                part.charAt(0)
        )
        .slice(0, 2)
        .join("")
        .toUpperCase();

}
