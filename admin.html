<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Summer School Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f5f8;color:#172033;padding-bottom:30px}
header{background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;padding:22px 18px}
.wrap,.container{max-width:1100px;margin:auto}.container{padding:16px}
.eyebrow{font-size:11px;letter-spacing:1px;font-weight:700;opacity:.8}
h1{margin:5px 0 0;font-size:25px}
.toolbar,.meal-settings,.panel{background:#fff;border-radius:15px;padding:14px;box-shadow:0 2px 10px #0000000b;margin-bottom:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,input,select{font:inherit}.btn,input,select{border:1px solid #dfe4ea;border-radius:9px;padding:9px 11px;background:#fff}.btn{cursor:pointer;font-weight:700}.primary{background:#2563eb;color:#fff;border-color:#2563eb}.danger{color:#b91c1c;border-color:#fecaca}
.section-title{font-weight:800;margin:20px 2px 9px}
.meal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.meal-card{border:1px solid #e5e7eb;border-radius:12px;padding:12px}.meal-card h3{margin:0 0 8px;font-size:14px}.meal-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hint,.small{font-size:11px;color:#6b7280;margin-top:6px}
.table-wrap,.week-wrap{overflow:auto;background:#fff;border-radius:15px;box-shadow:0 2px 10px #0000000b}
.table{min-width:1000px}.row{display:grid;grid-template-columns:180px repeat(4,1fr);border-bottom:1px solid #edf0f3}.cell{padding:10px;border-right:1px solid #edf0f3;min-height:86px}.head{font-weight:800;background:#f8fafc;min-height:auto}
.person{display:flex;gap:9px;align-items:center;font-weight:800}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#e0e7ff;color:#3730a3;font-size:11px;flex:none}
.shift{border-radius:10px;padding:8px;margin:3px 0;cursor:pointer}.shift.work{background:#dcfce7;color:#166534}.shift.excursion{background:#ede9fe;color:#5b21b6}.shift.lunch{background:#e0f2fe;color:#075985}.shift.dinner{background:#fef3c7;color:#92400e}.off{color:#9ca3af;font-size:12px}
.staff-manager{display:grid;gap:8px}.staff-row{display:flex;align-items:center;gap:10px;background:#f8fafc;padding:9px;border-radius:10px}.staff-row .name{flex:1;font-weight:700}
.week-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.week-title{font-size:16px;font-weight:800}.week-buttons{display:flex;gap:6px}
.week-header,.week-row{display:grid;grid-template-columns:105px repeat(15,125px);min-width:1980px}.week-header{background:#f8fafc;border-bottom:1px solid #e5e7eb}.week-head{padding:11px 6px;text-align:center;font-size:10px;font-weight:800;border-right:1px solid #e5e7eb}.week-row{min-height:105px;border-bottom:1px solid #edf0f3}.week-date{padding:12px 6px;text-align:center;background:#f8fafc;border-right:1px solid #e5e7eb;font-size:10px}.week-date strong{display:block;font-size:12px}.week-date.today{background:#eff6ff;color:#2563eb}.week-cell{padding:5px;border-right:1px solid #edf0f3}.week-item{border-radius:8px;padding:7px;margin-bottom:5px;font-size:10px;background:#dcfce7;border-left:3px solid #22c55e}.week-item.clickable{cursor:pointer}.week-item.excursion{background:#ede9fe;border-left-color:#8b5cf6}.week-item.lunch{background:#e0f2fe;border-left-color:#0ea5e9}.week-item.dinner{background:#fef3c7;border-left-color:#f59e0b}.week-item.meal{background:#f0fdf4;border-left-color:#22c55e}.week-name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.week-time,.week-staff{color:#64748b;margin-top:2px}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;padding:10px;z-index:20}.modal.show{display:flex}.modal-box{background:#fff;width:min(620px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 12px 12px;padding:18px}.modal-box h2{margin:0 0 14px}.form{display:grid;gap:10px}.form label{font-size:11px;font-weight:700;color:#6b7280}.form input,.form select{width:100%}.actions{display:flex;gap:8px;margin-top:14px}.actions>*{flex:1}
.staff-checkboxes{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.staff-check{display:flex;align-items:center;gap:7px;background:#f8fafc;padding:9px;border-radius:9px;font-size:12px;font-weight:700}.staff-check input{width:auto}
@media(max-width:700px){.meal-grid{grid-template-columns:1fr}.staff-checkboxes{grid-template-columns:1fr}.toolbar>*{flex:1}.row{grid-template-columns:150px repeat(4,1fr)}}
</style>
</head>
<body>
<header><div class="wrap"><div class="eyebrow">SUMMER SCHOOL 2026</div><h1>Schedule Admin</h1></div></header>

<main class="container">
<div class="toolbar">
<input id="date" type="date">
<button class="btn primary" onclick="openActivity()">＋ Add activity</button>
<button class="btn" onclick="openStaffManager()">👤 Manage staff</button>
<button class="btn" onclick="showWeek()">📅 Week view</button>
<button class="btn" onclick="copyDay()">Copy this day</button>
<button class="btn danger" onclick="clearDay()">Clear this day</button>
</div>

<div class="meal-settings">
<div style="font-weight:800">🍽 Meal times</div>
<div class="hint">These are when staff can eat. They are separate from lunch/dinner duty.</div>
<div class="meal-grid" style="margin-top:12px">
<div class="meal-card"><h3>Lunch</h3><div class="meal-fields"><input id="lunchStart" type="time"><input id="lunchEnd" type="time"></div></div>
<div class="meal-card"><h3>Dinner</h3><div class="meal-fields"><input id="dinnerStart" type="time"><input id="dinnerEnd" type="time"></div></div>
</div>
<button class="btn primary" style="margin-top:10px" onclick="saveMealTimes()">Save meal times</button>
</div>

<div id="dayView">
<div class="section-title">Daily rota</div>
<div class="table-wrap"><div id="table" class="table"></div></div>
</div>

<div id="weekView" style="display:none"></div>
</main>

<div id="activityModal" class="modal"><div class="modal-box">
<h2 id="modalTitle">Add activity</h2>
<div class="form">
<div><label>Activity / duty</label><input id="activity" placeholder="e.g. Sports Activities"></div>
<div><label>Type</label><select id="type">
<option value="activity">Activity</option><option value="excursion">Excursion</option><option value="duty">General duty</option><option value="lunch">Lunch duty</option><option value="dinner">Dinner duty</option>
</select></div>
<div><label>Date</label><input id="activityDate" type="date"></div>
<div class="meal-fields"><div><label>Start</label><input id="start" type="time"></div><div><label>End</label><input id="end" type="time"></div></div>
<div><label>Location</label><input id="location" placeholder="e.g. Dining Hall"></div>
<div><label>Group</label><input id="group" placeholder="e.g. Group B"></div>
<div><label>Staff assigned</label><div id="staffCheckboxes" class="staff-checkboxes"></div></div>
</div>
<div class="actions"><button class="btn" onclick="closeActivity()">Cancel</button><button class="btn danger" id="deleteBtn" onclick="deleteActivity()">Delete</button><button class="btn primary" onclick="saveActivity()">Save</button></div>
</div></div>

<div id="staffModal" class="modal"><div class="modal-box">
<h2>Manage staff</h2>
<div id="staffManager" class="staff-manager"></div>
<div style="border-top:1px solid #e5e7eb;padding-top:14px;margin-top:14px">
<label style="font-size:11px;font-weight:700;color:#6b7280">Add staff member</label>
<div style="display:flex;gap:8px;margin-top:5px"><input id="newStaffName" placeholder="e.g. John Smith" style="flex:1"><button class="btn primary" onclick="addStaff()">Add</button></div>
</div>
<div class="actions"><button class="btn" onclick="closeStaffManager()">Done</button></div>
</div></div>

<script src="app.js"></script>
<script>
let data = getData();
let editingId = null;
let weekStart = getMonday(TODAY);

const dateInput = document.getElementById("date");
dateInput.value = dateKey(TODAY);
dateInput.addEventListener("change", () => {
    showDay();
    render();
});

function initials(name) {
    return name.split(/\s+/).map(x => x[0]).slice(0,2).join("").toUpperCase();
}

function showDay() {
    document.getElementById("dayView").style.display = "block";
    document.getElementById("weekView").style.display = "none";
}

function render() {
    data = getData();
    loadMealFields();
    showDay();

    const d = parseDate(dateInput.value);
    const table = document.getElementById("table");
    let html = `<div class="row"><div class="cell head">Staff</div><div class="cell head">Morning</div><div class="cell head">Midday</div><div class="cell head">Afternoon</div><div class="cell head">Evening</div></div>`;

    data.staff.forEach(person => {
        const schedule = getStaffSchedule(person.id, d);
        html += `<div class="row"><div class="cell"><div class="person"><div class="avatar">${initials(person.name)}</div>${esc(person.name)}</div></div>`;

        ["Morning","Midday","Afternoon","Evening"].forEach(period => {
            const items = schedule.filter(x => periodFor(x.start) === period);
            html += `<div class="cell">`;
            if (!items.length) {
                html += `<div class="off">—</div>`;
            } else {
                items.forEach(x => {
                    html += `<div class="shift ${x.type}" onclick="editActivity('${x.id}')">
                        <b>${iconFor(x.type)} ${esc(x.name)}</b>
                        <div class="small">${x.start}–${x.end}</div>
                        ${x.location ? `<div class="small">📍 ${esc(x.location)}</div>` : ""}
                    </div>`;
                });
            }
            html += `</div>`;
        });
        html += `</div>`;
    });

    if (!data.staff.length) html = `<div style="padding:30px;text-align:center;color:#8a93a3">No staff added yet. Use Manage staff.</div>`;
    table.innerHTML = html;
}

function loadMealFields() {
    const m = getMealTimes();
    lunchStart.value = m.lunch?.start || "";
    lunchEnd.value = m.lunch?.end || "";
    dinnerStart.value = m.dinner?.start || "";
    dinnerEnd.value = m.dinner?.end || "";
}

function saveMealTimes() {
    data = getData();
    const ls = lunchStart.value, le = lunchEnd.value;
    const ds = dinnerStart.value, de = dinnerEnd.value;

    if ((ls && le && minutes(le) <= minutes(ls)) || (ds && de && minutes(de) <= minutes(ds))) {
        alert("Meal end time must be after the start time.");
        return;
    }

    data.mealTimes = {
        lunch: { enabled: !!(ls && le), start: ls, end: le },
        dinner: { enabled: !!(ds && de), start: ds, end: de }
    };
    saveData(data);
    render();
}

function renderStaffCheckboxes(selected = []) {
    const box = document.getElementById("staffCheckboxes");
    box.innerHTML = data.staff.length
        ? data.staff.map(person => `
            <label class="staff-check">
                <input type="checkbox" name="assignedStaff" value="${esc(person.id)}" ${selected.includes(person.id) ? "checked" : ""}>
                ${esc(person.name)}
            </label>
        `).join("")
        : `<div class="hint">Add staff members first.</div>`;
}

function openActivity(id = null) {
    data = getData();
    editingId = id;
    const existing = id ? data.activities.find(a => a.id === id) : null;

    document.getElementById("modalTitle").textContent = existing ? "Edit activity" : "Add activity";
    document.getElementById("deleteBtn").style.display = existing ? "block" : "none";

    document.getElementById("activity").value = existing?.name || "";
    document.getElementById("type").value = existing?.type || "activity";
    document.getElementById("activityDate").value = existing?.date || dateInput.value;
    document.getElementById("start").value = existing?.start || "09:00";
    document.getElementById("end").value = existing?.end || "10:00";
    document.getElementById("location").value = existing?.location || "";
    document.getElementById("group").value = existing?.group || "";

    renderStaffCheckboxes(existing?.staff || []);
    document.getElementById("activityModal").classList.add("show");
}

function closeActivity() {
    document.getElementById("activityModal").classList.remove("show");
    editingId = null;
}

function saveActivity() {
    data = getData();

    const selectedStaff = [...document.querySelectorAll('input[name="assignedStaff"]:checked')].map(x => x.value);
    const name = activity.value.trim();

    if (!name || !activityDate.value || !start.value || !end.value) {
        alert("Please complete the activity name, date, start and end time.");
        return;
    }

    if (minutes(end.value) <= minutes(start.value)) {
        alert("End time must be after start time.");
        return;
    }

    if (!selectedStaff.length) {
        alert("Assign at least one staff member.");
        return;
    }

    const record = {
        id: editingId || newId("activity"),
        name,
        type: type.value,
        date: activityDate.value,
        start: start.value,
        end: end.value,
        location: location.value.trim(),
        group: group.value.trim(),
        staff: selectedStaff
    };

    const index = data.activities.findIndex(a => a.id === editingId);
    if (index >= 0) data.activities[index] = record;
    else data.activities.push(record);

    saveData(data);
    dateInput.value = record.date;
    closeActivity();
    render();
}

function editActivity(id) {
    openActivity(id);
}

function deleteActivity() {
    if (!editingId || !confirm("Delete this activity?")) return;
    data = getData();
    data.activities = data.activities.filter(a => a.id !== editingId);
    saveData(data);
    closeActivity();
    render();
}

function copyDay() {
    const target = prompt("Copy this day to which date? Use YYYY-MM-DD.");
    if (!target || !/^\d{4}-\d{2}-\d{2}$/.test(target) || target === dateInput.value) return;

    data = getData();
    const source = data.activities.filter(a => a.date === dateInput.value);
    data.activities = data.activities.filter(a => a.date !== target);
    source.forEach(a => data.activities.push({...clone(a), id: newId("activity"), date: target}));
    saveData(data);
    alert("Day copied.");
    render();
}

function clearDay() {
    if (!confirm(`Clear every activity for ${dateInput.value}?`)) return;
    data = getData();
    data.activities = data.activities.filter(a => a.date !== dateInput.value);
    saveData(data);
    render();
}

function openStaffManager() {
    renderStaffManager();
    document.getElementById("staffModal").classList.add("show");
}

function closeStaffManager() {
    document.getElementById("staffModal").classList.remove("show");
    render();
}

function renderStaffManager() {
    data = getData();
    const box = document.getElementById("staffManager");
    box.innerHTML = data.staff.length
        ? data.staff.map(person => `
            <div class="staff-row">
                <div class="avatar">${initials(person.name)}</div>
                <div class="name">${esc(person.name)}</div>
                <button class="btn danger" onclick="removeStaff('${person.id}')">Delete</button>
            </div>
        `).join("")
        : `<div class="hint">No staff members yet.</div>`;
}

function addStaff() {
    const input = document.getElementById("newStaffName");
    const name = input.value.trim();
    if (!name) return alert("Enter a staff member name.");

    data = getData();
    if (data.staff.some(p => p.name.toLowerCase() === name.toLowerCase())) {
        return alert("That staff member already exists.");
    }

    data.staff.push({ id: newId("staff"), name });
    saveData(data);
    input.value = "";
    renderStaffManager();
    render();
}

function removeStaff(id) {
    data = getData();
    const person = data.staff.find(p => p.id === id);
    if (!person) return;

    if (!confirm(`Remove ${person.name}? They will also be removed from assigned activities.`)) return;

    data.staff = data.staff.filter(p => p.id !== id);
    data.activities.forEach(a => a.staff = a.staff.filter(s => s !== id));
    saveData(data);
    renderStaffManager();
    render();
}

function showWeek() {
    document.getElementById("dayView").style.display = "none";
    document.getElementById("weekView").style.display = "block";
    renderWeek();
}

function renderWeek() {
    data = getData();

    const hours = [];
    for (let h = 8; h <= 22; h++) hours.push(h);

    const days = Array.from({length: 7}, (_, i) => addDays(weekStart, i));
    const title = `${days[0].toLocaleDateString("en-GB",{day:"numeric",month:"short"})} – ${days[6].toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}`;

    let html = `
        <div class="week-nav">
            <div class="week-title">📅 ${title}</div>
            <div class="week-buttons">
                <button class="btn" onclick="previousWeek()">←</button>
                <button class="btn" onclick="currentWeek()">Today</button>
                <button class="btn" onclick="nextWeek()">→</button>
            </div>
        </div>
        <div class="week-wrap">
            <div class="week-header">
                <div class="week-head">Date</div>
                ${hours.map(h => `<div class="week-head">${String(h).padStart(2,"0")}:00</div>`).join("")}
            </div>
    `;

    days.forEach(day => {
        const key = dateKey(day);
        const today = key === dateKey(TODAY);

        html += `
            <div class="week-row">
                <div class="week-date ${today ? "today" : ""}">
                    <strong>${day.toLocaleDateString("en-GB",{weekday:"short"})}</strong>
                    ${day.getDate()} ${day.toLocaleDateString("en-GB",{month:"short"})}
                </div>
        `;

        hours.forEach(h => {
            const rs = h * 60, re = (h + 1) * 60;
            const acts = data.activities.filter(a =>
                a.date === key && minutes(a.start) < re && minutes(a.end) > rs
            );

            const meals = mealBlocksForDate(day).filter(m =>
                minutes(m.start) < re && minutes(m.end) > rs
            );

            html += `<div class="week-cell">`;

            meals.forEach(m => {
                html += `
                    <div class="week-item meal">
                        <div class="week-name">🍽️ ${m.meal} — staff meal</div>
                        <div class="week-time">${m.start}–${m.end}</div>
                    </div>`;
            });

            acts.forEach(a => {
                const names = a.staff.map(id => getStaff(id)?.name.split(" ")[0]).filter(Boolean).join(", ");
                html += `
                    <div class="week-item ${a.type} clickable" onclick="openActivity('${a.id}')">
                        <div class="week-name">${iconFor(a.type)} ${esc(a.name)}</div>
                        <div class="week-time">${a.start}–${a.end}</div>
                        <div class="week-staff">👤 ${esc(names || "No staff")}</div>
                    </div>`;
            });

            html += `</div>`;
        });

        html += `</div>`;
    });

    html += `</div>`;
    document.getElementById("weekView").innerHTML = html;
}

function previousWeek() {
    weekStart = addDays(weekStart, -7);
    renderWeek();
}

function nextWeek() {
    weekStart = addDays(weekStart, 7);
    renderWeek();
}

function currentWeek() {
    weekStart = getMonday(TODAY);
    renderWeek();
}

render();
</script>
</body>
</html>
