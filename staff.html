<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Schedule</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f5f8;color:#172033;padding-bottom:76px}
header{background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;padding:20px 18px}.wrap,.container{max-width:760px;margin:auto}.container{padding:16px}.back{color:#fff;text-decoration:none;font-size:13px}.eyebrow{font-size:11px;letter-spacing:1px;font-weight:700;opacity:.8;margin-top:15px}h1{margin:4px 0 0;font-size:27px}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 10px #0000000b;margin-bottom:14px}.tabs{display:flex;gap:7px}.tab{flex:1;border:0;border-radius:10px;padding:10px 5px;background:#e9edf3;color:#4b5563;font-weight:700}.tab.active{background:#2563eb;color:#fff}
.status{display:flex;align-items:center;gap:13px}.dot{width:16px;height:16px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 5px #dcfce7}.dot.off{background:#ef4444;box-shadow:0 0 0 5px #fee2e2}.muted{color:#6b7280;font-size:12px;margin-top:4px}.section{font-weight:800;margin:20px 2px 9px}
.meal-card{background:#fff;border-radius:15px;padding:14px;margin-bottom:9px;border-left:5px solid #22c55e;box-shadow:0 2px 8px #00000009}.meal-card.lunch{border-left-color:#0ea5e9}.meal-card.dinner{border-left-color:#f59e0b}.meal-title{font-weight:800}.meal-time{font-size:20px;font-weight:800;margin-top:3px}.meal-note{font-size:11px;color:#6b7280;margin-top:4px}
.shift{background:#fff;border-radius:15px;padding:14px;display:flex;gap:13px;border-left:5px solid #22c55e;box-shadow:0 2px 8px #00000009;margin-bottom:9px}.shift.excursion{border-left-color:#8b5cf6}.shift.lunch{border-left-color:#0ea5e9}.shift.dinner{border-left-color:#f59e0b}.shift.duty{border-left-color:#64748b}.shift.current{background:#f0fdf4;box-shadow:0 0 0 2px #bbf7d0}
.time{width:63px;text-align:right;flex-shrink:0}.start{font-weight:800;font-size:13px}.end{font-size:11px;color:#9ca3af;margin-top:3px}.content{flex:1;min-width:0}.title{font-weight:800;font-size:15px}.details{color:#6b7280;font-size:12px;line-height:1.6;margin-top:4px}.current-label{display:inline-block;background:#22c55e;color:#fff;border-radius:6px;padding:3px 6px;font-size:9px;font-weight:800;margin-bottom:6px}.empty{text-align:center;color:#8a93a3;padding:30px}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.summary-box{background:#fff;border-radius:14px;padding:15px;text-align:center}.number{font-size:21px;font-weight:800;color:#2563eb}.label{color:#9ca3af;font-size:10px;text-transform:uppercase;margin-top:3px}
.nav{position:fixed;bottom:0;left:0;right:0;height:64px;background:#fff;border-top:1px solid #e5e7eb;display:flex;justify-content:center;gap:70px;align-items:center}.nav a{color:#687386;text-decoration:none;text-align:center;font-size:11px}.nav span{display:block;font-size:20px}.nav .active{color:#2563eb}
</style>
</head>
<body>
<header><div class="wrap"><a class="back" href="index.html">← All Staff</a><div class="eyebrow">SUMMER SCHOOL 2026</div><h1 id="name">My Schedule</h1></div></header>

<main class="container">
<div class="card">
<div class="tabs">
<button class="tab active" data-day="0">Today</button>
<button class="tab" data-day="1">Tomorrow</button>
<button class="tab" data-day="2">Day after</button>
</div>
<div id="date" style="margin-top:12px;font-size:13px;font-weight:700"></div>
</div>

<div id="status" class="card"></div>

<div class="section">🍽 Meal times</div>
<div id="meals"></div>

<div class="section">Work schedule</div>
<div id="schedule"></div>

<div class="section">Summary</div>
<div id="summary" class="summary"></div>
</main>

<nav class="nav">
<a class="active" href="index.html"><span>⌂</span>Staff</a>
<a href="admin.html"><span>▦</span>Admin</a>
</nav>

<script src="app.js"></script>
<script>
const staffId = new URLSearchParams(location.search).get("id");
let offset = 0;

function render() {
    const data = getData();
    const staff = data.staff.find(s => s.id === staffId);

    if (!staff) {
        document.getElementById("name").textContent = "Staff Member";
        document.getElementById("status").innerHTML = `<div class="empty">Staff member not found. Open this page from the staff overview.</div>`;
        return;
    }

    const date = addDays(TODAY, offset);
    const schedule = getStaffSchedule(staff.id, date);
    const status = getStaffStatus(staff.id, date);

    document.getElementById("name").textContent = staff.name;
    document.getElementById("date").textContent = formatDate(date);

    document.querySelectorAll(".tab").forEach(button => {
        button.classList.toggle("active", Number(button.dataset.day) === offset);
    });

    document.getElementById("status").innerHTML = `
        <div class="status">
            <div class="dot ${status.working ? "" : "off"}"></div>
            <div>
                <strong>${status.current ? "Working now" : status.next ? `Next shift at ${status.next.start}` : "Not working"}</strong>
                <div class="muted">${status.item ? esc(status.item.name) : "No scheduled work shifts for this day."}</div>
            </div>
        </div>`;

    const meals = mealBlocksForDate(date);
    document.getElementById("meals").innerHTML = meals.length
        ? meals.map(meal => {
            const duty = schedule.some(a =>
                isMealDuty(a, meal.meal) &&
                minutes(a.start) < minutes(meal.end) &&
                minutes(a.end) > minutes(meal.start)
            );
            return `
                <div class="meal-card ${meal.meal.toLowerCase()}">
                    <div class="meal-title">🍽️ ${meal.meal}</div>
                    <div class="meal-time">${meal.start} – ${meal.end}</div>
                    <div class="meal-note">
                        Your eating time${duty ? " · You are also on duty during this meal" : ""}
                    </div>
                </div>`;
        }).join("")
        : `<div class="card empty">No meal times have been set.</div>`;

    const box = document.getElementById("schedule");

    if (!schedule.length) {
        box.innerHTML = `<div class="card empty">No work shifts scheduled.</div>`;
    } else {
        box.innerHTML = schedule.map(activity => {
            const current = status.current && status.current.id === activity.id;
            return `
                <div class="shift ${activity.type} ${current ? "current" : ""}">
                    <div class="time">
                        <div class="start">${activity.start}</div>
                        <div class="end">${activity.end}</div>
                    </div>
                    <div class="content">
                        ${current ? `<div class="current-label">Working now</div>` : ""}
                        <div class="title">${iconFor(activity.type)} ${esc(activity.name)}</div>
                        <div class="details">
                            ${activity.location ? `📍 ${esc(activity.location)}` : ""}
                            ${activity.group ? `<br>👥 ${esc(activity.group)}` : ""}
                        </div>
                    </div>
                </div>`;
        }).join("");
    }

    const totalMinutes = schedule.reduce((sum, a) =>
        sum + minutes(a.end) - minutes(a.start), 0
    );

    const hours = Math.floor(totalMinutes / 60);
    const mins = totalMinutes % 60;
    const hoursText = mins ? `${hours}h ${mins}m` : `${hours}h`;

    document.getElementById("summary").innerHTML = `
        <div class="summary-box">
            <div class="number">${hoursText}</div>
            <div class="label">Scheduled hours</div>
        </div>
        <div class="summary-box">
            <div class="number">${schedule.length}</div>
            <div class="label">Work shifts</div>
        </div>`;
}

document.querySelectorAll(".tab").forEach(button => {
    button.addEventListener("click", () => {
        offset = Number(button.dataset.day);
        render();
    });
});

render();
setInterval(render, 60000);
</script>
</body>
</html>
