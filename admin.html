<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<title>Summer School Admin</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f3f5f8;
    color: #172033;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

header {
    background:
        linear-gradient(
            135deg,
            #2563eb,
            #4f46e5
        );

    color: white;

    padding: 24px 18px;
}

.wrap {
    max-width: 850px;
    margin: auto;
}

.eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    opacity: .8;
}

h1 {
    margin: 5px 0 0;
    font-size: 27px;
}

.container {
    max-width: 850px;
    margin: auto;
    padding: 16px;
}

.toolbar {
    background: white;
    border-radius: 16px;
    padding: 14px;

    display: flex;
    gap: 9px;
    flex-wrap: wrap;

    box-shadow:
        0 2px 10px rgba(0,0,0,.05);

    margin-bottom: 16px;
}

input,
select,
button {
    font: inherit;
}

input,
select {
    border:
        1px solid #dfe4ea;

    border-radius: 10px;

    padding: 10px;
}

button {
    border: 0;

    border-radius: 10px;

    padding: 10px 14px;

    font-weight: 700;

    cursor: pointer;
}

.primary {
    background: #2563eb;
    color: white;
}

.secondary {
    background: #eef2ff;
    color: #3730a3;
}

.danger {
    background: #fee2e2;
    color: #991b1b;
}

.date {
    flex: 1;
    min-width: 180px;
}

.activity {
    background: white;

    border-radius: 16px;

    padding: 16px;

    margin-bottom: 12px;

    box-shadow:
        0 2px 10px rgba(0,0,0,.05);
}

.activity-top {
    display: flex;
    gap: 12px;
    align-items: flex-start;
}

.activity-icon {
    width: 44px;
    height: 44px;

    border-radius: 12px;

    display: grid;
    place-items: center;

    font-size: 21px;

    background: #dcfce7;
}

.activity-info {
    flex: 1;
}

.activity-name {
    font-weight: 800;
    font-size: 16px;
}

.activity-time {
    color: #6b7280;
    font-size: 12px;
    margin-top: 4px;
}

.activity-details {
    color: #6b7280;
    font-size: 12px;
    line-height: 1.6;
    margin-top: 8px;
}

.staff-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;

    margin-top: 13px;
}

.staff-chip {
    background: #eef2ff;

    color: #3730a3;

    border-radius: 999px;

    padding: 6px 9px;

    font-size: 11px;

    font-weight: 700;
}

.actions {
    display: flex;
    gap: 7px;

    margin-top: 13px;
}

.actions button {
    flex: 1;
}

.empty {
    background: white;

    border-radius: 16px;

    padding: 45px 20px;

    text-align: center;

    color: #8a93a3;
}

.modal {
    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.55);

    display: none;

    align-items: flex-end;

    justify-content: center;

    padding: 10px;

    z-index: 100;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: min(550px, 100%);

    background: white;

    border-radius:
        20px
        20px
        12px
        12px;

    padding: 20px;

    max-height: 92vh;

    overflow-y: auto;
}

.modal-box h2 {
    margin: 0 0 18px;
}

.form {
    display: grid;

    gap: 12px;
}

.form label {
    display: block;

    font-size: 11px;

    font-weight: 700;

    color: #6b7280;

    margin-bottom: 5px;
}

.form input,
.form select {
    width: 100%;
}

.time-row {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;
}

.staff-heading {
    margin-top: 5px;

    font-size: 13px;

    font-weight: 800;
}

.staff-checkboxes {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 7px;
}

.staff-check {
    border:
        1px solid #e5e7eb;

    border-radius: 10px;

    padding: 10px;

    cursor: pointer;

    display: flex;

    align-items: center;

    gap: 8px;

    font-size: 12px;

    font-weight: 600;
}

.staff-check:has(input:checked) {
    background: #eff6ff;

    border-color: #93c5fd;

    color: #1d4ed8;
}

.modal-actions {
    display: flex;

    gap: 8px;

    margin-top: 18px;
}

.modal-actions button {
    flex: 1;
}

@media(max-width:500px) {

    .staff-checkboxes {
        grid-template-columns: 1fr;
    }

    .time-row {
        grid-template-columns: 1fr 1fr;
    }

}

</style>

</head>


<body>


<header>

<div class="wrap">

<div class="eyebrow">
SUMMER SCHOOL 2026
</div>

<h1>
Activities & Excursions
</h1>

</div>

</header>


<main class="container">


<div class="toolbar">

<input
    id="date"
    class="date"
    type="date"
>

<button
    class="primary"
    onclick="openAdd()"
>
＋ Add Activity
</button>

<button
    class="secondary"
    onclick="copyDay()"
>
Copy Day
</button>

<button
    class="danger"
    onclick="clearDay()"
>
Clear Day
</button>

</div>


<div id="activities"></div>


</main>


<div
    id="modal"
    class="modal"
>

<div class="modal-box">


<h2 id="modalTitle">
Add Activity
</h2>


<div class="form">


<div>

<label>
Activity / Excursion
</label>

<input
    id="name"
    placeholder="e.g. Cambridge Trip"
>

</div>


<div>

<label>
Type
</label>

<select id="type">

<option value="activity">
Activity
</option>

<option value="excursion">
Excursion
</option>

<option value="lunch">
Lunch Duty
</option>

<option value="dinner">
Dinner Duty
</option>

<option value="duty">
Staff Duty
</option>

</select>

</div>


<div class="time-row">

<div>

<label>
Start
</label>

<input
    id="start"
    type="time"
>

</div>


<div>

<label>
End
</label>

<input
    id="end"
    type="time"
>

</div>

</div>


<div>

<label>
Location
</label>

<input
    id="location"
    placeholder="e.g. Cambridge"
>

</div>


<div>

<label>
Group
</label>

<input
    id="group"
    placeholder="e.g. Group A"
>

</div>


<div class="staff-heading">

Staff Assigned

</div>


<div
    id="staffCheckboxes"
    class="staff-checkboxes"
></div>


</div>


<div class="modal-actions">

<button
    class="secondary"
    onclick="closeModal()"
>
Cancel
</button>


<button
    id="deleteButton"
    class="danger"
    onclick="deleteActivity()"
>
Delete
</button>


<button
    class="primary"
    onclick="saveActivity()"
>
Save Activity
</button>

</div>


</div>

</div>


<script src="app.js"></script>


<script>

let data = getData();

let editingId = null;


const dateInput =
    document.getElementById("date");


dateInput.value =
    dateKey(TODAY);


dateInput.addEventListener(
    "change",
    render
);


/* =====================================================
   ICON
===================================================== */

function iconFor(type) {

    if (type === "excursion")
        return "🚌";

    if (type === "lunch")
        return "🍽️";

    if (type === "dinner")
        return "🍽️";

    if (type === "duty")
        return "📋";

    return "🟢";
}


/* =====================================================
   RENDER
===================================================== */

function render() {

    data = getData();

    const date =
        dateInput.value;

    const activities =
        data.activities
            .filter(
                activity =>
                    activity.date === date
            )
            .sort(
                (a,b) =>
                    minutes(a.start) -
                    minutes(b.start)
            );


    const container =
        document.getElementById(
            "activities"
        );


    if (!activities.length) {

        container.innerHTML = `

            <div class="empty">

                <div style="
                    font-size:35px;
                    margin-bottom:10px;
                ">
                    📅
                </div>

                <strong>
                    No activities scheduled
                </strong>

                <div style="
                    margin-top:5px;
                    font-size:12px;
                ">
                    Add an activity or excursion
                    to get started.
                </div>

            </div>

        `;

        return;
    }


    container.innerHTML = "";


    activities.forEach(activity => {

        const staff =
            activity.staff
                .map(id =>
                    data.staff.find(
                        person =>
                            person.id === id
                    )
                )
                .filter(Boolean);


        const div =
            document.createElement(
                "div"
            );


        div.className =
            "activity";


        div.innerHTML = `

            <div class="activity-top">

                <div class="activity-icon">
                    ${iconFor(activity.type)}
                </div>


                <div class="activity-info">

                    <div class="activity-name">

                        ${esc(activity.name)}

                    </div>


                    <div class="activity-time">

                        ${activity.start}
                        –
                        ${activity.end}

                    </div>


                    <div class="activity-details">

                        ${
                            activity.location
                            ?
                            `📍 ${esc(activity.location)}`
                            :
                            ""
                        }

                        ${
                            activity.group
                            ?
                            `<br>👥 ${esc(activity.group)}`
                            :
                            ""
                        }

                    </div>

                </div>

            </div>


            <div class="staff-list">

                ${
                    staff.length

                    ?

                    staff.map(person => `

                        <span class="staff-chip">

                            ${esc(person.name)}

                        </span>

                    `).join("")

                    :

                    `<span
                        style="
                            color:#ef4444;
                            font-size:11px;
                        "
                    >
                        No staff assigned
                    </span>`
                }

            </div>


            <div class="actions">

                <button
                    class="secondary"
                    onclick="editActivity('${activity.id}')"
                >
                    Edit
                </button>


                <button
                    class="danger"
                    onclick="removeActivity('${activity.id}')"
                >
                    Delete
                </button>

            </div>

        `;


        container.appendChild(div);

    });

}


/* =====================================================
   STAFF CHECKBOXES
===================================================== */

function renderStaffCheckboxes(
    selected = []
) {

    const container =
        document.getElementById(
            "staffCheckboxes"
        );


    container.innerHTML =
        data.staff.map(person => `

            <label class="staff-check">

                <input
                    type="checkbox"
                    value="${person.id}"
                    ${selected.includes(person.id)
                        ? "checked"
                        : ""}
                >

                ${esc(person.name)}

            </label>

        `).join("");

}


/* =====================================================
   OPEN ADD
===================================================== */

function openAdd() {

    editingId = null;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Add Activity";


    document.getElementById(
        "deleteButton"
    ).style.display =
        "none";


    document.getElementById(
        "name"
    ).value = "";


    document.getElementById(
        "type"
    ).value =
        "activity";


    document.getElementById(
        "start"
    ).value = "";


    document.getElementById(
        "end"
    ).value = "";


    document.getElementById(
        "location"
    ).value = "";


    document.getElementById(
        "group"
    ).value = "";


    renderStaffCheckboxes();


    document.getElementById(
        "modal"
    ).classList.add("show");
}


/* =====================================================
   EDIT
===================================================== */

function editActivity(id) {

    const activity =
        data.activities.find(
            item =>
                item.id === id
        );


    if (!activity)
        return;


    editingId = id;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Edit Activity";


    document.getElementById(
        "deleteButton"
    ).style.display =
        "block";


    document.getElementById(
        "name"
    ).value =
        activity.name;


    document.getElementById(
        "type"
    ).value =
        activity.type;


    document.getElementById(
        "start"
    ).value =
        activity.start;


    document.getElementById(
        "end"
    ).value =
        activity.end;


    document.getElementById(
        "location"
    ).value =
        activity.location || "";


    document.getElementById(
        "group"
    ).value =
        activity.group || "";


    renderStaffCheckboxes(
        activity.staff
    );


    document.getElementById(
        "modal"
    ).classList.add("show");
}


/* =====================================================
   SAVE
===================================================== */

function saveActivity() {

    const name =
        document.getElementById(
            "name"
        ).value.trim();


    const type =
        document.getElementById(
            "type"
        ).value;


    const start =
        document.getElementById(
            "start"
        ).value;


    const end =
        document.getElementById(
            "end"
        ).value;


    const location =
        document.getElementById(
            "location"
        ).value.trim();


    const group =
        document.getElementById(
            "group"
        ).value.trim();


    const staff =
        [...document.querySelectorAll(
            "#staffCheckboxes input:checked"
        )].map(
            checkbox =>
                checkbox.value
        );


    if (!name || !start || !end) {

        alert(
            "Please enter an activity name, start time and end time."
        );

        return;
    }


    if (
        minutes(end) <=
        minutes(start)
    ) {

        alert(
            "The end time must be after the start time."
        );

        return;
    }


    if (!staff.length) {

        if (
            !confirm(
                "No staff members have been assigned. Save anyway?"
            )
        ) {

            return;
        }
    }


    if (editingId) {

        const activity =
            data.activities.find(
                item =>
                    item.id === editingId
            );


        if (activity) {

            activity.name = name;

            activity.type = type;

            activity.date =
                dateInput.value;

            activity.start = start;

            activity.end = end;

            activity.location =
                location;

            activity.group =
                group;

            activity.staff =
                staff;
        }

    } else {

        data.activities.push({

            id: newId("activity"),

            name,

            type,

            date:
                dateInput.value,

            start,

            end,

            location,

            group,

            staff

        });

    }


    saveData(data);

    closeModal();

    render();
}


/* =====================================================
   DELETE
===================================================== */

function deleteActivity() {

    if (!editingId)
        return;


    if (
        !confirm(
            "Delete this activity? It will be removed from every assigned staff member's schedule."
        )
    ) {

        return;
    }


    data.activities =
        data.activities.filter(
            activity =>
                activity.id !== editingId
        );


    saveData(data);

    closeModal();

    render();
}


function removeActivity(id) {

    if (
        !confirm(
            "Delete this activity?"
        )
    ) {

        return;
    }


    data.activities =
        data.activities.filter(
            activity =>
                activity.id !== id
        );


    saveData(data);

    render();
}


/* =====================================================
   COPY DAY
===================================================== */

function copyDay() {

    const target =
        prompt(
            "Copy this day's activities to which date?\n\nUse YYYY-MM-DD."
        );


    if (!target)
        return;


    if (
        !/^\d{4}-\d{2}-\d{2}$/.test(
            target
        )
    ) {

        alert(
            "Please use YYYY-MM-DD."
        );

        return;
    }


    if (
        target === dateInput.value
    ) {

        alert(
            "Choose a different date."
        );

        return;
    }


    const source =
        data.activities.filter(
            activity =>
                activity.date ===
                dateInput.value
        );


    const copied =
        source.map(activity => ({

            ...structuredClone(activity),

            id:
                newId("activity"),

            date:
                target

        }));


    data.activities =
        data.activities.filter(
            activity =>
                activity.date !== target
        );


    data.activities.push(
        ...copied
    );


    saveData(data);


    alert(
        `${copied.length} activities copied.`
    );
}


/* =====================================================
   CLEAR DAY
===================================================== */

function clearDay() {

    const date =
        dateInput.value;


    if (
        !confirm(
            `Clear every activity on ${date}?`
        )
    ) {

        return;
    }


    data.activities =
        data.activities.filter(
            activity =>
                activity.date !== date
        );


    saveData(data);

    render();
}


/* =====================================================
   CLOSE
===================================================== */

function closeModal() {

    document.getElementById(
        "modal"
    ).classList.remove("show");

}


/* =====================================================
   START
===================================================== */

render();

</script>

</body>

</html>
