<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Weekly Schedule</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f3f5f8;
    color: #172033;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    padding-bottom: 80px;
}

header {
    background:
        linear-gradient(
            135deg,
            #2563eb,
            #4f46e5
        );

    color: white;
    padding: 20px;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 16px;
}

.eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    opacity: .8;
}

h1 {
    margin: 4px 0 0;
    font-size: 27px;
}

.week-navigation {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;

    background: white;
    padding: 12px;

    border-radius: 14px;

    margin-bottom: 15px;

    box-shadow:
        0 2px 10px rgba(0,0,0,.05);
}

.week-navigation button {
    border: 0;
    background: #eef2ff;
    color: #2563eb;

    border-radius: 9px;

    padding: 9px 12px;

    font-weight: 700;
}

.week-title {
    text-align: center;
    font-weight: 800;
    font-size: 13px;
}

.day {
    background: white;

    border-radius: 15px;

    margin-bottom: 14px;

    overflow: hidden;

    box-shadow:
        0 2px 10px rgba(0,0,0,.05);
}

.day-header {
    padding: 13px 15px;

    background: #f8fafc;

    border-bottom:
        1px solid #e5e7eb;
}

.day-header.today {
    background: #eff6ff;
    color: #2563eb;
}

.day-name {
    font-size: 16px;
    font-weight: 800;
}

.day-date {
    font-size: 11px;
    color: #64748b;
    margin-top: 2px;
}

.event {
    display: grid;

    grid-template-columns:
        65px 1fr;

    gap: 12px;

    padding: 12px 15px;

    border-bottom:
        1px solid #f0f2f5;
}

.event:last-child {
    border-bottom: 0;
}

.event-time {
    font-size: 12px;
    font-weight: 700;
    color: #64748b;

    padding-top: 4px;
}

.event-card {
    border-radius: 10px;

    padding: 9px 11px;

    border-left:
        4px solid #22c55e;

    background: #f0fdf4;
}

.event-card.excursion {
    background: #f5f3ff;
    border-left-color: #8b5cf6;
}

.event-card.duty {
    background: #f8fafc;
    border-left-color: #64748b;
}

.event-card.meal {
    background: #f0f9ff;
    border-left-color: #0ea5e9;
}

.event-title {
    font-size: 13px;
    font-weight: 800;
}

.event-details {
    color: #64748b;
    font-size: 11px;
    margin-top: 3px;
    line-height: 1.5;
}

.badge {
    display: inline-block;

    font-size: 9px;
    font-weight: 800;

    padding: 3px 6px;

    border-radius: 5px;

    margin-bottom: 4px;
}

.badge.meal {
    background: #e0f2fe;
    color: #075985;
}

.badge.excursion {
    background: #ede9fe;
    color: #5b21b6;
}

.empty {
    padding: 18px;

    text-align: center;

    color: #9ca3af;

    font-size: 12px;
}

.nav {
    position: fixed;

    bottom: 0;
    left: 0;
    right: 0;

    height: 65px;

    background: white;

    border-top:
        1px solid #e5e7eb;

    display: flex;

    justify-content: space-around;

    align-items: center;

    z-index: 10;
}

.nav a {
    color: #687386;

    text-decoration: none;

    text-align: center;

    font-size: 10px;

    min-width: 70px;
}

.nav span {
    display: block;
    font-size: 20px;
    margin-bottom: 2px;
}

.nav a.active {
    color: #2563eb;
}

@media (min-width: 700px) {

    .week {
        display: grid;

        grid-template-columns:
            1fr 1fr;

        gap: 14px;
    }

    .day {
        margin-bottom: 0;
    }

}

</style>

</head>

<body>

<header>

<div class="container">

<div class="eyebrow">
    SUMMER SCHOOL 2026
</div>

<h1>
    Weekly Schedule
</h1>

</div>

</header>


<main class="container">

<div class="week-navigation">

<button onclick="previousWeek()">
    ←
</button>

<div
    id="weekTitle"
    class="week-title"
></div>

<button onclick="nextWeek()">
    →
</button>

</div>


<div id="week"></div>

</main>


<nav class="nav">

<a href="index.html">
    <span>🏠</span>
    Home
</a>

<a
    href="week.html"
    class="active"
>
    <span>📅</span>
    Week
</a>

<a href="admin.html">
    <span>⚙️</span>
    Admin
</a>

</nav>


<script src="app.js"></script>

<script>

let weekStart =
    getMonday(TODAY);


function renderWeek() {

    const week =
        document.getElementById(
            "week"
        );

    const days = [];

    for (
        let i = 0;
        i < 7;
        i++
    ) {

        days.push(
            addDays(
                weekStart,
                i
            )
        );

    }


    const first =
        days[0].toLocaleDateString(
            "en-GB",
            {
                day: "numeric",
                month: "short"
            }
        );

    const last =
        days[6].toLocaleDateString(
            "en-GB",
            {
                day: "numeric",
                month: "short",
                year: "numeric"
            }
        );


    document.getElementById(
        "weekTitle"
    ).textContent =
        `${first} – ${last}`;


    week.innerHTML = "";


    days.forEach(day => {

        const activities =
            getActivitiesForDate(
                day
            );


        const isToday =
            dateKey(day) ===
            dateKey(TODAY);


        const dayElement =
            document.createElement(
                "div"
            );

        dayElement.className =
            "day";


        let html = `

            <div
                class="
                    day-header
                    ${isToday ? "today" : ""}
                "
            >

                <div class="day-name">

                    ${
                        day.toLocaleDateString(
                            "en-GB",
                            {
                                weekday: "long"
                            }
                        )
                    }

                </div>

                <div class="day-date">

                    ${
                        day.toLocaleDateString(
                            "en-GB",
                            {
                                day: "numeric",
                                month: "long",
                                year: "numeric"
                            }
                        )
                    }

                    ${
                        isToday
                            ? " · TODAY"
                            : ""
                    }

                </div>

            </div>

        `;


        if (!activities.length) {

            html += `

                <div class="empty">

                    No activities scheduled

                </div>

            `;

        } else {

            activities.forEach(
                activity => {

                    let typeClass =
                        activity.type;

                    let title =
                        activity.name;

                    let badge = "";


                    if (
                        activity.type ===
                        "meal"
                    ) {

                        typeClass =
                            "meal";

                        title =
                            getMealLabel(
                                activity
                            );

                        badge = `

                            <div
                                class="
                                    badge
                                    meal
                                "
                            >
                                🍽️ MEAL
                            </div>

                        `;

                    } else if (
                        activity.type ===
                        "excursion"
                    ) {

                        badge = `

                            <div
                                class="
                                    badge
                                    excursion
                                "
                            >
                                🚌 EXCURSION
                            </div>

                        `;

                    }


                    html += `

                        <div class="event">

                            <div class="event-time">

                                ${activity.start}

                                <br>

                                ${activity.end}

                            </div>


                            <div
                                class="
                                    event-card
                                    ${typeClass}
                                "
                            >

                                ${badge}

                                <div
                                    class="
                                        event-title
                                    "
                                >

                                    ${
                                        iconFor(
                                            activity.type
                                        )
                                    }

                                    ${esc(title)}

                                </div>


                                <div
                                    class="
                                        event-details
                                    "
                                >

                                    ${
                                        activity.location
                                            ? `📍 ${esc(
                                                activity.location
                                            )}`
                                            : ""
                                    }

                                    ${
                                        activity.group
                                            ? `<br>👥 ${esc(
                                                activity.group
                                            )}`
                                            : ""
                                    }

                                    ${
                                        activity.type ===
                                            "meal"

                                            ? (
                                                activity.dutyStaff.length
                                                    ? `<br>🔶 ${activity.dutyStaff
                                                        .map(
                                                            id =>
                                                                getStaff(id)
                                                                    ?.name
                                                        )
                                                        .filter(Boolean)
                                                        .join(", ")} on duty`
                                                    : `<br>Eating time for staff`
                                              )

                                            : (
                                                activity.staff.length
                                                    ? `<br>👤 ${activity.staff
                                                        .map(
                                                            id =>
                                                                getStaff(id)
                                                                    ?.name
                                                        )
                                                        .filter(Boolean)
                                                        .join(", ")}`
                                                    : ""
                                              )
                                    }

                                </div>

                            </div>

                        </div>

                    `;

                }
            );

        }


        dayElement.innerHTML =
            html;


        week.appendChild(
            dayElement
        );

    });

}


function previousWeek() {

    weekStart =
        addDays(
            weekStart,
            -7
        );

    renderWeek();

}


function nextWeek() {

    weekStart =
        addDays(
            weekStart,
            7
        );

    renderWeek();

}


renderWeek();

</script>

</body>

</html>
