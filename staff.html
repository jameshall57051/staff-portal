<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Staff Schedule</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    background: #f3f5f8;
    color: #172033;
    padding-bottom: 80px;
}

/* HEADER */

header {
    background: linear-gradient(135deg, #2563eb, #4f46e5);
    color: white;
    padding: 22px 20px;
}

.header-inner {
    max-width: 750px;
    margin: auto;
}

.back-link {
    display: inline-block;
    color: white;
    text-decoration: none;
    font-size: 13px;
    margin-bottom: 15px;
}

.header-small {
    font-size: 11px;
    letter-spacing: 1px;
    font-weight: 700;
    opacity: .8;
}

header h1 {
    margin: 4px 0 0;
    font-size: 27px;
}

/* MAIN */

.container {
    max-width: 750px;
    margin: auto;
    padding: 20px 15px;
}

/* DATE */

.date-card {
    background: white;
    border-radius: 16px;
    padding: 15px 18px;
    margin-bottom: 18px;
    box-shadow: 0 2px 10px rgba(0,0,0,.05);
    text-align: center;
}

.date-card small {
    display: block;
    color: #9ca3af;
    font-size: 10px;
    letter-spacing: .6px;
    margin-bottom: 4px;
}

.date-card strong {
    font-size: 16px;
}

/* STATUS */

.status-card {
    background: white;
    border-radius: 17px;
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: 0 3px 12px rgba(0,0,0,.05);
}

.status-row {
    display: flex;
    align-items: center;
    gap: 12px;
}

.status-dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    flex-shrink: 0;
}

.status-working {
    background: #22c55e;
    box-shadow: 0 0 0 5px #dcfce7;
}

.status-off {
    background: #ef4444;
    box-shadow: 0 0 0 5px #fee2e2;
}

.status-text {
    font-weight: 700;
    font-size: 15px;
}

.status-subtext {
    color: #6b7280;
    font-size: 12px;
    margin-top: 4px;
}

/* SECTION */

.section-title {
    font-size: 16px;
    font-weight: 700;
    margin: 22px 3px 10px;
}

/* SCHEDULE */

.schedule {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.schedule-item {
    background: white;
    border-radius: 15px;
    padding: 14px;
    display: flex;
    gap: 13px;
    box-shadow: 0 2px 8px rgba(0,0,0,.04);
    border-left: 5px solid #22c55e;
}

.schedule-item.lunch {
    border-left-color: #0ea5e9;
}

.schedule-item.dinner {
    border-left-color: #f59e0b;
}

.schedule-time {
    width: 70px;
    flex-shrink: 0;
    text-align: right;
    padding-top: 2px;
}

.start-time {
    font-size: 14px;
    font-weight: 700;
}

.end-time {
    font-size: 11px;
    color: #9ca3af;
    margin-top: 3px;
}

.schedule-content {
    flex: 1;
    min-width: 0;
}

.activity-name {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 5px;
}

.activity-details {
    color: #6b7280;
    font-size: 12px;
    line-height: 1.6;
}

/* CURRENT */

.current {
    background: #f0fdf4;
    border-left-color: #16a34a;
    box-shadow: 0 0 0 2px #bbf7d0;
}

.current-label {
    display: inline-block;
    background: #22c55e;
    color: white;
    border-radius: 6px;
    padding: 3px 6px;
    font-size: 9px;
    font-weight: 700;
    margin-bottom: 6px;
    text-transform: uppercase;
}

/* EMPTY */

.empty {
    background: white;
    border-radius: 16px;
    padding: 35px 20px;
    text-align: center;
    color: #9ca3af;
    box-shadow: 0 2px 8px rgba(0,0,0,.04);
}

/* SUMMARY */

.summary {
    background: white;
    border-radius: 15px;
    padding: 16px;
    margin-top: 18px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,.04);
}

.summary-box {
    text-align: center;
    padding: 8px;
}

.summary-number {
    font-size: 21px;
    font-weight: 700;
    color: #2563eb;
}

.summary-label {
    font-size: 10px;
    color: #9ca3af;
    text-transform: uppercase;
    letter-spacing: .4px;
    margin-top: 3px;
}

/* NAV */

.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 65px;
    background: white;
    border-top: 1px solid #e5e7eb;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 70px;
    z-index: 50;
}

.bottom-nav a {
    text-decoration: none;
    color: #6b7280;
    font-size: 11px;
    text-align: center;
}

.bottom-nav a.active {
    color: #2563eb;
}

.bottom-nav span {
    display: block;
    font-size: 20px;
    margin-bottom: 2px;
}

@media (max-width: 500px) {

    .schedule-time {
        width: 60px;
    }

    .start-time {
        font-size: 13px;
    }

    .activity-name {
        font-size: 14px;
    }

}

</style>

</head>


<body>


<header>

<div class="header-inner">

<a href="index.html" class="back-link">
    ← All Staff
</a>

<div class="header-small">
    SUMMER SCHOOL 2026
</div>

<h1 id="employeeName">
    Staff Schedule
</h1>

</div>

</header>


<main class="container">


<div class="date-card">

<small>
    TODAY
</small>

<strong id="dateDisplay">
    Loading...
</strong>

</div>


<div id="statusCard" class="status-card">
</div>


<div class="section-title">
    Today's Schedule
</div>


<div id="schedule" class="schedule">
</div>


<div id="summary" class="summary">
</div>


</main>


<nav class="bottom-nav">

<a href="index.html" class="active">

<span>⌂</span>

Staff

</a>


<a href="admin.html">

<span>▦</span>

Schedules

</a>

</nav>


<script>

/* =====================================================
   LOAD DATA
===================================================== */

const defaultData = {

    employees: [

        {
            id: "james",
            name: "James Hall",

            schedules: {

                "2026-08-19": [

                    {
                        id: "j1",
                        type: "activity",
                        name: "Morning Registration",
                        start: "09:00",
                        end: "10:00",
                        location: "Main Hall",
                        group: "All Students"
                    },

                    {
                        id: "j2",
                        type: "activity",
                        name: "English Classes",
                        start: "10:00",
                        end: "12:00",
                        location: "Classroom 4",
                        group: "Group B"
                    },

                    {
                        id: "j3",
                        type: "lunch",
                        name: "Lunch Duty",
                        start: "12:00",
                        end: "14:00",
                        location: "Dining Hall",
                        group: ""
                    },

                    {
                        id: "j4",
                        type: "activity",
                        name: "Sports Activities",
                        start: "14:00",
                        end: "16:00",
                        location: "Basketball Court",
                        group: "Group B"
                    },

                    {
                        id: "j5",
                        type: "dinner",
                        name: "Dinner Duty",
                        start: "18:00",
                        end: "19:30",
                        location: "Dining Hall",
                        group: ""
                    }

                ]

            }

        },

        {
            id: "sarah",
            name: "Sarah Smith",

            schedules: {

                "2026-08-19": [

                    {
                        id: "s1",
                        type: "activity",
                        name: "English Classes",
                        start: "09:00",
                        end: "12:00",
                        location: "Classroom 2",
                        group: "Group A"
                    },

                    {
                        id: "s2",
                        type: "lunch",
                        name: "Lunch Duty",
                        start: "12:00",
                        end: "14:00",
                        location: "Dining Hall",
                        group: ""
                    },

                    {
                        id: "s3",
                        type: "activity",
                        name: "Arts & Crafts",
                        start: "14:00",
                        end: "16:00",
                        location: "Art Room",
                        group: "Group A"
                    }

                ]

            }

        },

        {
            id: "tom",
            name: "Tom Jones",

            schedules: {

                "2026-08-19": [

                    {
                        id: "t1",
                        type: "activity",
                        name: "Campus Games",
                        start: "11:00",
                        end: "13:00",
                        location: "Sports Field",
                        group: "Group C"
                    },

                    {
                        id: "t2",
                        type: "activity",
                        name: "Sports Activities",
                        start: "14:00",
                        end: "17:00",
                        location: "Sports Field",
                        group: "Group C"
                    },

                    {
                        id: "t3",
                        type: "dinner",
                        name: "Dinner Duty",
                        start: "18:00",
                        end: "20:00",
                        location: "Dining Hall",
                        group: ""
                    }

                ]

            }

        },

        {
            id: "emma",
            name: "Emma Brown",

            schedules: {

                "2026-08-19": [

                    {
                        id: "e1",
                        type: "activity",
                        name: "Arts & Crafts",
                        start: "09:00",
                        end: "11:00",
                        location: "Art Room",
                        group: "Group A"
                    },

                    {
                        id: "e2",
                        type: "activity",
                        name: "Movie Preparation",
                        start: "14:00",
                        end: "16:00",
                        location: "Common Room",
                        group: "All Students"
                    }

                ]

            }

        }

    ]

};


/* =====================================================
   LOAD SAVED DATA
===================================================== */

let data;

const savedData =
    localStorage.getItem("summerSchoolData");

if (savedData) {

    try {

        data = JSON.parse(savedData);

    } catch (error) {

        console.error(
            "Could not read saved data:",
            error
        );

        data = defaultData;

    }

} else {

    data = defaultData;

}


/* =====================================================
   GET EMPLOYEE FROM URL
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const employeeId =
    params.get("id");


const employee =
    data.employees.find(
        item => item.id === employeeId
    );


/* =====================================================
   DATE
===================================================== */

const today = new Date();

const selectedDate =
    today.toISOString().substring(0, 10);


function formatDate() {

    return today.toLocaleDateString(
        "en-GB",
        {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );

}


/* =====================================================
   TIME FUNCTIONS
===================================================== */

function timeToMinutes(time) {

    const parts =
        time.split(":");

    return (
        parseInt(parts[0], 10) * 60 +
        parseInt(parts[1], 10)
    );

}


function currentMinutes() {

    return (
        today.getHours() * 60 +
        today.getMinutes()
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(text) {

    return String(text || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   GET TODAY'S SCHEDULE
===================================================== */

function getSchedule() {

    if (
        !employee ||
        !employee.schedules ||
        !employee.schedules[selectedDate]
    ) {

        return [];

    }

    return [
        ...employee.schedules[selectedDate]
    ].sort(
        (a, b) =>
            timeToMinutes(a.start) -
            timeToMinutes(b.start)
    );

}


/* =====================================================
   RENDER STATUS
===================================================== */

function renderStatus() {

    const card =
        document.getElementById(
            "statusCard"
        );

    const schedule =
        getSchedule();

    const now =
        currentMinutes();


    const current =
        schedule.find(item => {

            const start =
                timeToMinutes(item.start);

            const end =
                timeToMinutes(item.end);

            return (
                now >= start &&
                now < end
            );

        });


    const next =
        schedule.find(item => {

            return (
                timeToMinutes(item.start) >
                now
            );

        });


    if (current) {

        card.innerHTML = `

            <div class="status-row">

                <div class="status-dot status-working"></div>

                <div>

                    <div class="status-text">
                        Working now
                    </div>

                    <div class="status-subtext">

                        ${escapeHtml(current.name)}
                        ·
                        ${current.start}
                        –
                        ${current.end}

                    </div>

                </div>

            </div>

        `;

        return;

    }


    if (next) {

        card.innerHTML = `

            <div class="status-row">

                <div class="status-dot status-working"></div>

                <div>

                    <div class="status-text">
                        Next shift at ${next.start}
                    </div>

                    <div class="status-subtext">

                        ${escapeHtml(next.name)}
                        ·
                        ${next.start}
                        –
                        ${next.end}

                    </div>

                </div>

            </div>

        `;

        return;

    }


    card.innerHTML = `

        <div class="status-row">

            <div class="status-dot status-off"></div>

            <div>

                <div class="status-text">
                    Not working
                </div>

                <div class="status-subtext">
                    No more scheduled shifts today.
                </div>

            </div>

        </div>

    `;

}


/* =====================================================
   RENDER SCHEDULE
===================================================== */

function renderSchedule() {

    const container =
        document.getElementById(
            "schedule"
        );

    const schedule =
        getSchedule();


    container.innerHTML = "";


    if (!schedule.length) {

        container.innerHTML = `

            <div class="empty">

                <div style="
                    font-size:30px;
                    margin-bottom:10px;
                ">
                    💤
                </div>

                No shifts scheduled today.

            </div>

        `;

        return;

    }


    const now =
        currentMinutes();


    schedule.forEach(item => {

        const start =
            timeToMinutes(item.start);

        const end =
            timeToMinutes(item.end);


        const isCurrent =
            now >= start &&
            now < end;


        const div =
            document.createElement("div");


        div.className =
            "schedule-item " +

            (
                item.type === "lunch"
                    ? "lunch"
                    : item.type === "dinner"
                        ? "dinner"
                        : ""
            ) +

            (
                isCurrent
                    ? " current"
                    : ""
            );


        div.innerHTML = `

            <div class="schedule-time">

                <div class="start-time">
                    ${escapeHtml(item.start)}
                </div>

                <div class="end-time">
                    ${escapeHtml(item.end)}
                </div>

            </div>


            <div class="schedule-content">

                ${
                    isCurrent
                    ?
                    `
                    <div class="current-label">
                        Working now
                    </div>
                    `
                    :
                    ""
                }


                <div class="activity-name">
                    ${escapeHtml(item.name)}
                </div>


                <div class="activity-details">

                    ${
                        item.location
                        ?
                        `📍 ${escapeHtml(item.location)}`
                        :
                        ""
                    }


                    ${
                        item.group
                        ?
                        `
                        <br>
                        👥 ${escapeHtml(item.group)}
                        `
                        :
                        ""
                    }

                </div>

            </div>

        `;


        container.appendChild(div);

    });

}


/* =====================================================
   SUMMARY
===================================================== */

function renderSummary() {

    const schedule =
        getSchedule();


    let totalMinutes = 0;


    schedule.forEach(item => {

        const start =
            timeToMinutes(item.start);

        const end =
            timeToMinutes(item.end);

        totalMinutes +=
            end - start;

    });


    const hours =
        Math.floor(
            totalMinutes / 60
        );


    const minutes =
        totalMinutes % 60;


    let hoursText =
        hours + "h";


    if (minutes > 0) {

        hoursText +=
            " " +
            minutes +
            "m";

    }


    document.getElementById(
        "summary"
    ).innerHTML = `

        <div class="summary-box">

            <div class="summary-number">
                ${hoursText}
            </div>

            <div class="summary-label">
                Scheduled hours
            </div>

        </div>


        <div class="summary-box">

            <div class="summary-number">
                ${schedule.length}
            </div>

            <div class="summary-label">
                Shifts today
            </div>

        </div>

    `;

}


/* =====================================================
   EMPLOYEE NOT FOUND
===================================================== */

function showMissingEmployee() {

    document.getElementById(
        "employeeName"
    ).textContent =
        "Staff Member";


    document.getElementById(
        "statusCard"
    ).innerHTML = `

        <div class="empty">
            Staff member not found.
        </div>

    `;


    document.getElementById(
        "schedule"
    ).innerHTML = "";


    document.getElementById(
        "summary"
    ).innerHTML = "";

}


/* =====================================================
   MAIN RENDER
===================================================== */

function render() {

    document.getElementById(
        "dateDisplay"
    ).textContent =
        formatDate();


    if (!employee) {

        showMissingEmployee();

        return;

    }


    document.getElementById(
        "employeeName"
    ).textContent =
        employee.name;


    renderStatus();

    renderSchedule();

    renderSummary();

}


/* =====================================================
   START
===================================================== */

render();


/*
Refresh every minute so that
"Working now" updates automatically.
*/

setInterval(
    render,
    60000
);

</script>

</body>

</html>
