<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><title>Summer School Staff</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f5f8;color:#172033;padding-bottom:76px}header{background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;padding:24px 18px}.wrap{max-width:900px;margin:auto}.eyebrow{font-size:11px;letter-spacing:1px;font-weight:700;opacity:.8}.header-row{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{margin:4px 0 0;font-size:26px}.container{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 10px #0000000b;margin-bottom:14px}.date-row{display:flex;justify-content:space-between;align-items:center}.date-row small{display:block;color:#8a93a3;font-size:10px;text-transform:uppercase}.date-row strong{font-size:16px}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer;background:#eef2ff;color:#3730a3;text-decoration:none}.staff-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.staff-card{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid #edf0f4;border-radius:16px;padding:15px;box-shadow:0 2px 9px #00000009}.staff-top{display:flex;align-items:center;gap:10px}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#e0e7ff;color:#3730a3;font-weight:800}.name{font-weight:800;font-size:15px}.status{margin-left:auto;font-size:11px;font-weight:800;display:flex;align-items:center;gap:6px}.dot{width:10px;height:10px;border-radius:50%}.green{background:#22c55e}.red{background:#ef4444}.next{border-top:1px solid #eef0f3;margin-top:13px;padding-top:12px}.label{font-size:10px;text-transform:uppercase;color:#9ca3af;letter-spacing:.5px}.activity{font-weight:750;margin-top:4px}.muted{color:#6b7280;font-size:12px;margin-top:3px}.empty{text-align:center;color:#8a93a3;padding:25px}.nav{position:fixed;bottom:0;left:0;right:0;height:64px;background:#fff;border-top:1px solid #e5e7eb;display:flex;justify-content:center;gap:70px;align-items:center;z-index:5}.nav a{color:#687386;text-decoration:none;text-align:center;font-size:11px}.nav span{display:block;font-size:20px}.nav .active{color:#2563eb}@media(max-width:620px){.staff-grid{grid-template-columns:1fr}h1{font-size:23px}}
</style></head><body><header><div class="wrap"><div class="eyebrow">SUMMER SCHOOL 2026</div><div class="header-row"><h1>Staff Dashboard</h1><a class="btn" href="staff.html">My Schedule</a></div></div></header><main class="container"><div class="card date-row"><div><small>Today</small><strong id="date"></strong></div><button class="btn" onclick="render()">↻ Refresh</button></div><div id="grid" class="staff-grid"></div></main><nav class="nav"><a class="active" href="index.html"><span>⌂</span>Staff</a><a href="admin.html"><span>▦</span>Admin</a></nav><script src="app.js"></script><script>
function initials(n){return n.split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase()}
function render(){const data=getData();document.getElementById('date').textContent=formatDate(TODAY);const g=document.getElementById('grid');g.innerHTML='';if(!data.staff.length){g.innerHTML='<div class="card empty">No staff added yet.</div>';return}data.staff.forEach(e=>{const s=getStaffStatus(e.id,TODAY),a=document.createElement('a');a.className='staff-card';a.href='staff.html?id='+encodeURIComponent(e.id);a.innerHTML=`<div class="staff-top"><div class="avatar">${initials(e.name)}</div><div class="name">${esc(e.name)}</div><div class="status"><i class="dot ${s.working?'green':'red'}"></i>${s.working?'Working':'Off'}</div></div><div class="next">${s.item?`<div class="label">${s.current?'Working now':'Next shift'}</div><div class="activity">${iconFor(s.item.type)} ${esc(s.item.name)}</div><div class="muted">${s.item.start}–${s.item.end}${s.item.location?' · 📍 '+esc(s.item.location):''}</div>`:'<div class="label">Today</div><div class="muted">No scheduled work shifts</div>'}</div>`;g.appendChild(a)})}
render();setInterval(render,60000);
</script></body></html>
