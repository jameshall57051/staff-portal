<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Summer School - Staff Dashboard</title>


<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background: #f3f5f8;

    color: #172033;

    padding-bottom: 80px;
}


/* =====================================================
   HEADER
===================================================== */

header {

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #4f46e5
        );

    color: white;

    padding: 25px 20px;
}

.header-inner {

    max-width: 850px;

    margin: auto;
}

.header-small {

    font-size: 11px;

    letter-spacing: 1px;

    font-weight: 700;

    opacity: .8;
}

header h1 {

    margin: 5px 0 0;

    font-size: 27px;
}


/* =====================================================
   MAIN
===================================================== */

.container {

    max-width: 850px;

    margin: auto;

    padding: 20px 15px;
}


/* =====================================================
   DATE HEADER
===================================================== */

.date-card {

    background: white;

    border-radius: 16px;

    padding: 15px 18px;

    margin-bottom: 18px;

    box-shadow:
        0 2px 10px rgba(0,0,0,.05);

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;
}

.date-card small {

    display: block;

    color: #6b7280;

    font-size: 11px;

    margin-bottom: 3px;
}

.date-card strong {

    font-size: 16px;
}


/* =====================================================
   STAFF GRID
===================================================== */

.staff-grid {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 14px;
}


/* =====================================================
   STAFF CARD
===================================================== */

.staff-card {

    background: white;

    border-radius: 17px;

    padding: 18px;

    text-decoration: none;

    color: inherit;

    box-shadow:
        0 3px 12px rgba(0,0,0,.05);

    transition:
        transform .15s ease,
        box-shadow .15s ease;

    border: 1px solid #eef0f3;

    display: block;
}

.staff-card:hover {

    transform: translateY(-2px);

    box-shadow:
        0 7px 20px rgba(0,0,0,.08);
}


/* =====================================================
   STAFF CARD HEADER
===================================================== */

.staff-header {

    display: flex;

    align-items: center;

    gap: 12px;

    margin-bottom: 15px;
}


/* AVATAR */

.avatar {

    width: 46px;

    height: 46px;

    border-radius: 50%;

    background:
        #e0e7ff;

    color: #3730a3;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 16px;

    font-weight: 700;

    flex-shrink: 0;
}


/* NAME */

.staff-name {

    flex: 1;
}

.staff-name h2 {

    font-size: 16px;

    margin: 0 0 3px;

    line-height: 1.2;
}

.staff-name p {

    margin: 0;

    color: #9ca3af;

    font-size: 11px;
}


/* =====================================================
   STATUS
===================================================== */

.status {

    display: flex;

    align-items: center;

    gap: 6px;

    font-size: 11px;

    font-weight: 700;
}

.status-dot {

    width: 11px;

    height: 11px;

    border-radius: 50%;

    flex-shrink: 0;
}


/* WORKING */

.status-working {

    color: #15803d;
}

.status-working .status-dot {

    background: #22c55e;

    box-shadow:
        0 0 0 4px #dcfce7;
}


/* NOT WORKING */

.status-off {

    color: #dc2626;
}

.status-off .status-dot {

    background: #ef4444;

    box-shadow:
        0 0 0 4px #fee2e2;
}


/* =====================================================
   NEXT SHIFT
===================================================== */

.next-shift {

    border-top:
        1px solid #eef0f2;

    padding-top: 13px;
}

.next-shift-label {

    color: #9ca3af;

    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: .5px;

    margin-bottom: 5px;
}

.next-shift-name {

    font-weight: 700;

    font-size: 14px;

    margin-bottom: 3px;
}

.next-shift-time {

    font-size: 12px;

    color: #6b7280;
}

.next-shift-location {

    font-size: 11px;

    color: #9ca3af;

    margin-top: 3px;
}


/* =====================================================
   OFF MESSAGE
===================================================== */

.off-message {

    border-top:
        1px solid #eef0f2;

    padding-top: 13px;

    color: #9ca3af;

    font-size: 12px;
}


/* =====================================================
   EMPTY
===================================================== */

.empty {

    background: white;

    border-radius: 16px;

    padding: 35px 20px;

    text-align: center;

    color: #9ca3af;
}


/* =====================================================
   ADMIN BUTTON
===================================================== */

.admin-link {

    display: block;

    background: white;

    border-radius: 14px;

    padding: 14px;

    margin-top: 18px;

    text-align: center;

    text-decoration: none;

    color: #2563eb;

    font-size: 13px;

    font-weight: 700;

    box-shadow:
        0 2px 8px rgba(0,0,0,.04);
}


/* =====================================================
   BOTTOM NAV
===================================================== */

.bottom-nav {

    position: fixed;

    bottom: 0;

    left: 0;

    right: 0;

    height: 65px;

    background: white;

    border-top:
        1px solid #e5e7eb;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 70px;

    z-index: 50;
}

.bottom-nav a {

    text-decoration: none;

    color: #6b7280;

    font-size: 11px;

    text-align: center;
}

.bottom-nav a.active {

    color: #2563eb;
}

.bottom-nav span {

    display: block;

    font-size: 20px;

    margin-bottom: 2px;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .staff-grid {

        grid-template-columns: 1fr;
    }

    header h1 {

        font-size: 23px;
    }

    .staff-card {

        padding: 16px;
    }
}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media (max-width: 360px) {

    .staff-header {

        gap: 9px;
    }

    .staff-name h2 {

        font-size: 15px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

<div class="header-inner">

<div class="header-small">
    SUMMER SCHOOL 2026
</div>

<h1>
    Staff Dashboard
</h1>

</div>

</header>


<main class="container">


<!-- =====================================================
     DATE
===================================================== -->

<div class="date-card">

<div>

<small>
    TODAY
</small>

<strong id="dateDisplay">
    Loading...
</strong>

</div>

</div>


<!-- =====================================================
     STAFF
===================================================== -->

<div
    id="staffGrid"
    class="staff-grid">

</div>


<!-- =====================================================
     ADMIN
===================================================== -->

<a
    href="admin.html"
    class="admin-link">

    ⚙️ Manage Staff Schedules

</a>


</main>


<!-- =====================================================
     BOTTOM NAV
===================================================== -->

<nav class="bottom-nav">

<a
    href="index.html"
    class="active">

<span>⌂</span>

Staff

</a>


<a href="admin.html">

<span>▦</span>

Schedules

</a>

</nav>


<script>

/* =====================================================
   DEFAULT DATA
===================================================== */

const defaultData = {

employees: [

{
id: "james",
name: "James Hall",

schedules: {

"2026-08-19": [

{
id: "j1",
type: "activity",
name: "Morning Registration",
start: "09:00",
end: "10:00",
location: "Main Hall",
group: "All Students"
},

{
id: "j2",
type: "activity",
name: "English Classes",
start: "10:00",
end: "12:00",
location: "Classroom 4",
group: "Group B"
},

{
id: "j3",
type: "lunch",
name: "Lunch Duty",
start: "12:00",
end: "14:00",
location: "Dining Hall",
group: ""
},

{
id: "j4",
type: "activity",
name: "Sports Activities",
start: "14:00",
end: "16:00",
location: "Basketball Court",
group: "Group B"
},

{
id: "j5",
type: "dinner",
name: "Dinner Duty",
start: "18:00",
end: "19:30",
location: "Dining Hall",
group: ""
}

]

}

},

{
id: "sarah",
name: "Sarah Smith",

schedules: {

"2026-08-19": [

{
id: "s1",
type: "activity",
name: "English Classes",
start: "09:00",
end: "12:00",
location: "Classroom 2",
group: "Group A"
},

{
id: "s2",
type: "lunch",
name: "Lunch Duty",
start: "12:00",
end: "14:00",
location: "Dining Hall",
group: ""
},

{
id: "s3",
type: "activity",
name: "Arts & Crafts",
start: "14:00",
end: "16:00",
location: "Art Room",
group: "Group A"
}

]

}

},

{
id: "tom",
name: "Tom Jones",

schedules: {

"2026-08-19": [

{
id: "t1",
type: "activity",
name: "Campus Games",
start: "11:00",
end: "13:00",
location: "Sports Field",
group: "Group C"
},

{
id: "t2",
type: "activity",
name: "Sports Activities",
start: "14:00",
end: "17:00",
location: "Sports Field",
group: "Group C"
},

{
id: "t3",
type: "dinner",
name: "Dinner Duty",
start: "18:00",
end: "20:00",
location: "Dining Hall",
group: ""
}

]

}

},

{
id: "emma",
name: "Emma Brown",

schedules: {

"2026-08-19": [

{
id: "e1",
type: "activity",
name: "Arts & Crafts",
start: "09:00",
end: "11:00",
location: "Art Room",
group: "Group A"
},

{
id: "e2",
type: "activity",
name: "Movie Preparation",
start: "14:00",
end: "16:00",
location: "Common Room",
group: "All Students"
}

]

}

}

]

};


/* =====================================================
   LOAD DATA
===================================================== */

let data =
JSON.parse(
localStorage.getItem(
"summerSchoolData"
)
) || defaultData;


/* =====================================================
   DATE
===================================================== */

/*
For testing this uses today's date.

If there is no schedule for today,
the example data date is used instead.
*/

const today =
new Date();

const selectedDate =
today
.toISOString()
.substring(0,10);


function formatDate() {

return today.toLocaleDateString(
"en-GB",
{
weekday: "long",
day: "numeric",
month: "long",
year: "numeric"
}
);

}


/* =====================================================
   TIME
===================================================== */

function timeToMinutes(time) {

const parts =
time.split(":");

return (
parseInt(parts[0]) * 60
+
parseInt(parts[1])
);

}


/* =====================================================
   GET CURRENT TIME
===================================================== */

function getCurrentMinutes() {

return (
today.getHours() * 60
+
today.getMinutes()
);

}


/* =====================================================
   FIND CURRENT / NEXT SHIFT
===================================================== */

function getStaffStatus(employee) {

const schedule =
employee.schedules &&
employee.schedules[selectedDate]
    ? employee.schedules[selectedDate]
    : [];


const now =
getCurrentMinutes();


/*
Sort activities by start time.
*/

const sorted =
[...schedule]
.sort(
(a,b) =>
timeToMinutes(a.start)
-
timeToMinutes(b.start)
);


/*
Find activity currently being worked.
*/

const current =
sorted.find(item => {

const start =
timeToMinutes(item.start);

const end =
timeToMinutes(item.end);

return (
now >= start &&
now < end
);

});


if (current) {

return {

status: "working",

item: current,

label: "Working now"

};

}


/*
Find next shift.
*/

const next =
sorted.find(item => {

return (
timeToMinutes(item.start)
>
now
);

});


if (next) {

return {

status: "working",

item: next,

label: "Next shift"

};

}


/*
Nothing else today.
*/

return {

status: "off",

item: null,

label: "Not working"

};

}


/* =====================================================
   INITIALS
===================================================== */

function getInitials(name) {

const parts =
name
.trim()
.split(/\s+/);


if (parts.length === 1) {

return parts[0]
.substring(0,2)
.toUpperCase();

}


return (
parts[0][0] +
parts[parts.length - 1][0]
).toUpperCase();

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(text) {

return String(text || "")
.replace(
/&/g,
"&amp;"
)
.replace(
/</g,
"&lt;"
)
.replace(
/>/g,
"&gt;"
)
.replace(
/"/g,
"&quot;"
)
.replace(
/'/g,
"&#039;"
);

}


/* =====================================================
   DISPLAY TIME
===================================================== */

function formatTime(time) {

return time;


/* =====================================================
   STAFF CARDS
===================================================== */

function renderStaff() {

const grid =
document.getElementById(
"staffGrid"
);


grid.innerHTML = "";


if (!data.employees.length) {

grid.innerHTML = `

<div class="empty">

    No staff members have been added yet.

</div>

`;

return;

}


data.employees.forEach(
employee => {


const status =
getStaffStatus(employee);


const card =
document.createElement("a");


/*
This takes the employee to
their individual dashboard.

We pass their ID in the URL.
*/

card.href =
"staff.html?id=" +
encodeURIComponent(
employee.id
);


card.className =
"staff-card";


let shiftHtml = "";


if (status.item) {

shiftHtml = `

<div class="next-shift">

<div class="next-shift-label">

${status.label}

</div>

<div class="next-shift-name">

${escapeHtml(
status.item.name
)}

</div>

<div class="next-shift-time">

${formatTime(
status.item.start
)}
 –
${formatTime(
status.item.end
)}

</div>

${
status.item.location
?
`
<div class="next-shift-location">

📍
${escapeHtml(
status.item.location
)}

</div>
`
:
""
}

</div>

`;

} else {

shiftHtml = `

<div class="off-message">

No more scheduled shifts today

</div>

`;

}


card.innerHTML = `

<div class="staff-header">


<div class="avatar">

${getInitials(
employee.name
)}

</div>


<div class="staff-name">

<h2>

${escapeHtml(
employee.name
)}

</h2>

<p>

View today's schedule →

</p>

</div>


<div class="status ${
status.status === "working"
? "status-working"
: "status-off"
}">

<div class="status-dot"></div>

${
status.status === "working"
? "Working"
: "Off"
}

</div>


</div>


${shiftHtml}

`;


grid.appendChild(
card
);

});

}


/* =====================================================
   RENDER
===================================================== */

function render() {

document.getElementById(
"dateDisplay"
).textContent =
formatDate();


renderStaff();

}


/* =====================================================
   START
===================================================== */

render();


/*
Refresh every minute so the
working/off indicators update.
*/

setInterval(
render,
60000
);

</script>

</body>

</html>
